# Pre-commit 配置 (CODE_REVIEW_PLAN Task 2.2)
# 标准 pre-commit 框架, 与现有 githooks/pre-commit 互补。
# 安装: pre-commit install --hook-type pre-commit
# 备选: git config core.hooksPath githooks
# 详见 docs/CODE_REVIEW_PROCESS.md §3.3
repos:
  # 本地钩子: 复用现有门禁脚本, 与 CI 等价
  - repo: local
    hooks:
      # G-3 修复 (2026-08-08): 新增 py_compile 语法检查门禁.
      # 见 docs/CODE_REVIEW_GAP_AUDIT_2026-08-08.md D-4 + docs/CODE_REVIEW_COMPREHENSIVE_20260808.md G-3.
      # 防止 D-4 类 (f-string 反斜杠 / docstring 重复粘贴) 语法错误入库.
      # 成本: ~1s/文件; 收益: 阻断所有 SyntaxError 入库 (D-4 三例均会被拦截).
      - id: py_compile_check
        name: py_compile 语法检查 (G-3)
        entry: python -m py_compile
        language: system
        files: \.py$
        # 排除: 测试文件 (含 Python 3.10+ with(...) 语法)
        # + unsloth 编译缓存 + mlruns/ 运行日志 (不可人工维护)
        exclude: "(^|/)(tests/.*\\.py$|unsloth_compiled_cache/|mlruns/|node_modules/|qlib_env/)"
        pass_filenames: true
      - id: pre_commit_check
        name: P0 三道门禁+P0 print 检查
        entry: python scripts/pre_commit_check.py
        language: system
        pass_filenames: false
        # 紧急跳过: SKIP_P0_PRINT=1 跳过 print 检查; SKIP_P0_CHECK=1 跳过全部
        always_run: true
      - id: quant_review_lint
        name: 量化专项静态检查
        entry: python scripts/quant_review_lint.py
        language: system
        pass_filenames: true
        files: ^(ms_strategy/src/(execution|backtest|data)/|utils/|cli/).*\.py$
        # 当前仅 warning, 试点无误报后升阻断
      # P0-6 (2026-09-13): 前视偏差守护接入提交门禁 (增量模式)。
      # CRITICAL (bfill/后向填充) 阻断; HIGH/MEDIUM 告警 (CI_LOOKAHEAD_STRICT=1 阻断)。
      - id: lookahead_guard
        name: 前视偏差守护 (P0-6)
        entry: python ci_lookahead_guard.py --files
        language: system
        files: \.py$
        pass_filenames: true

  # ruff: 本地增量 lint (Python 3.8+) — 2026-09-01 bump 到 v0.16.1 对齐 venv, 修复 UP045 等规则 unknown
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix, --exit-zero]
        # 仅检查脚本指定的文件, 不拦阻断, 与 CI incremental-static 互补

  # 基础 hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        args: [--maxkb=2048]
