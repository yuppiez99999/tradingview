# ruff 代码质量检查配置
# https://docs.astral.sh/ruff/configuration/

# 目标 Python 版本
target-version = "py311"

# 行长度（与 black 一致）
line-length = 120

# 排除目录（第三方/生成/缓存代码）
extend-exclude = [
    "temp",
    "qlib_env",
    "ifind-finance-data-1.3.0",
    "v8.3_institutional/hexin_broker",
    "node_modules",
    ".git",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    # B7 修复 (2026-08-08): 排除第三方 vendored 代码 (F821 噪声).
    # 见 docs/CODE_REVIEW_COMPREHENSIVE_20260808.md B7.
    "external/airllm_src",
    "unsloth_compiled_cache",
    # 临时分析产物目录 (2026-08-30): 一次性报告/日志/分析脚本, 非生产代码。
    # 该类目录为未跟踪产物, CI 的 git diff 不会纳入; 本地全量验证会因
    # 一行流分析脚本 (E701/E702/T201) 产生阻断级假阳性, 故按目录模式排除。
    "_test_report_*",
]

[lint]
# 启用规则集
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (F401 未使用导入, F811 重定义, F821 未定义名称, F841 未使用变量)
    "W",    # pycodestyle warnings
    "B",    # flake8-bugbear (B006 可变默认参数等)
    "C90",  # mccabe 复杂度
    "I",    # isort 导入排序
    "N",    # pep8-naming 命名规范
    "UP",   # pyupgrade 现代语法
    "ANN",  # flake8-annotations 类型注解
    "T",    # flake8-print (T201 print, T203 pprint) — Wave 3 第四阶段 PRINT 清零门禁
    "BLE",  # flake8-blind-except (BLE001 except Exception) — 宽泛 except 门禁
    "DTZ003",  # flake8-datetimez — datetime.utcnow() 已全量清零 (2026-09-10), 永久禁止回退
]

# 忽略规则（项目特定）
ignore = [
    "E501",   # 行长度由 black 处理
    "ANN204", # 特殊方法 __init__/__str__ 等不需要返回注解
    "B008",   # 函数默认值中的函数调用（如 Depends()）
    "UP045",  # 保持 Optional[X] 语法 (py38 target, 与项目现有代码一致)
    "UP007",  # 保持 Optional[X] → X|Y 不强制 (与 UP045 同理, py38 兼容)
    "UP037",  # 保持引号注解一致性 (py38 target)
    "ANN401", # 允许 Any 类型 (DQC 事件 context 等动态字段需要)
]

# 修复规则
fixable = ["ALL"]
unfixable = [
    "B",    # bugbear 检测不自动修复
    "ANN",  # 类型注解不自动添加
]

[lint.mccabe]
# 最大圈复杂度
max-complexity = 15

[lint.isort]
# 导入排序配置
known-first-party = ["ai_decision", "utils", "ms_strategy"]
force-single-line = false

[lint.per-file-ignores]
