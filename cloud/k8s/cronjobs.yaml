# ============================================================
# cronjobs.yaml — K8s CronJob 调度 (替代 Windows 任务计划 register_all_tasks_unified.ps1)
# 时区: Asia/Shanghai (K8s >=1.25 支持 timeZone 字段; 不支持时改 UTC 减8)
# 交易日: 周一至周五 (1-5); 实盘下单通过 RemoteQmtBroker → Win 网关桥接
# 镜像: qt-system:v1 (cloud/docker/Dockerfile.system)
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: quant
---
# ---------- 1. 盘前工作流 07:00 ----------
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pre-market
  namespace: quant
spec:
  schedule: "0 7 * * 1-5"
  timeZone: "Asia/Shanghai"
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 7200
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: worker
              image: qt-system:v1
              imagePullPolicy: IfNotPresent
              command: ["python", "15_每日工作流/run_daily_morning.py", "--phase", "all"]
              envFrom:
                - secretRef: { name: quant-secret }
                - configMapRef: { name: quant-config }
              volumeMounts:
                - { name: data, mountPath: /app/data_cache }
                - { name: qlib-data, mountPath: /app/qlib_data }
                - { name: logs, mountPath: /app/logs }
                - { name: reports, mountPath: /app/reports }
              resources:
                requests: { cpu: "1", memory: "2Gi" }
                limits: { cpu: "4", memory: "8Gi" }
          volumes:
            - { name: data, persistentVolumeClaim: { claimName: data-pvc } }
            - { name: qlib-data, persistentVolumeClaim: { claimName: qlib-pvc } }
            - { name: logs, emptyDir: {} }
            - { name: reports, persistentVolumeClaim: { claimName: reports-pvc } }
---
# ---------- 2. 盘前生成交易指令 09:00 ----------
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pre-market-instructions
  namespace: quant
spec:
  schedule: "0 9 * * 1-5"
  timeZone: "Asia/Shanghai"
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: worker
              image: qt-system:v1
              command: ["python", "daily_trade_executor.py", "pre-market"]
              envFrom:
                - secretRef: { name: quant-secret }
                - configMapRef: { name: quant-config }
              volumeMounts:
                - { name: data, mountPath: /app/data_cache }
                - { name: logs, mountPath: /app/logs }
                - { name: trade-plans, mountPath: /app/trade_plans }
                - { name: trade-instr, mountPath: /app/trade_instructions }
              resources:
                requests: { cpu: "1", memory: "2Gi" }
                limits: { cpu: "2", memory: "4Gi" }
          volumes:
            - { name: data, persistentVolumeClaim: { claimName: data-pvc } }
            - { name: logs, emptyDir: {} }
            - { name: trade-plans, persistentVolumeClaim: { claimName: trade-plans-pvc } }
            - { name: trade-instr, persistentVolumeClaim: { claimName: trade-instr-pvc } }
---
# ---------- 3. 盘中 LLM 决策 09:30-15:30 每30分钟 ----------
apiVersion: batch/v1
kind: CronJob
metadata:
