  namespace: quant
spec:
  schedule: "*/30 9-15 * * 1-5"
  timeZone: "Asia/Shanghai"
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1200
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: worker
              image: qt-system:v1
              command: ["python", "v8.3_institutional/llm_intraday_decision_engine.py", "--mode", "live"]
              envFrom:
                - secretRef: { name: quant-secret }
                - configMapRef: { name: quant-config }
              volumeMounts:
                - { name: data, mountPath: /app/data_cache }
                - { name: logs, mountPath: /app/logs }
              resources:
                requests: { cpu: "1", memory: "2Gi" }
                limits: { cpu: "2", memory: "4Gi" }
          volumes:
            - { name: data, persistentVolumeClaim: { claimName: data-pvc } }
            - { name: logs, emptyDir: {} }
---
