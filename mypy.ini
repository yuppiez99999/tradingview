# MyPy config - Ultimate Quant Trading System (Phase 3-B, 2026-07-26)
# ============================================================
# Progressive strict mode: fix obvious errors first, then tighten.
#
# Current strategy (Phase 3-B):
#   - Basic type checking (warn_unused_ignores, warn_redundant_casts)
#   - Allow Any type (avoid mass rewrites, tighten later)
#   - Not full strict mode (defer to Phase 3-C)
#   - Exclude non-core dirs (research/, tests/, tools/, scripts/, ms_strategy/, .venv/)
#
# Later path:
#   Phase 3-C: strict=True + disallow_any_generics=True
#   Phase 3-D: warn_return_any=True + full project typing

[mypy]
# Python target version
python_version = 3.11

# Progressive strict: enable warnings, but not full strict.
# warn_unused_ignores would avalanche in a large untyped codebase
# (imprecise type: ignore codes trigger cascading errors);
# keep disabled until type coverage improves (Phase 3-D).
warn_unused_ignores = False
warn_redundant_casts = True
warn_unused_configs = True
no_implicit_optional = True

# Type check scope (tighten later)
# Phase 3-C: check_untyped_defs = True
# Phase 3-D: disallow_untyped_defs = True, disallow_any_generics = True
check_untyped_defs = False
disallow_untyped_defs = False
disallow_any_generics = False

# Error display
show_error_codes = True
show_column_numbers = True
pretty = True

# Performance
fast_module_lookup = True
sqlite_cache = True
cache_dir = .mypy_cache

# Exclude non-core dirs (tighten later)
exclude =
    (?x)(
        ^research/|
        ^tests/|
        ^tools/|
        ^scripts/|
        ^ms_strategy/|
        ^v8\.3_institutional/src/ai/llm_client\.py$|
        ^v8\.3_institutional/src/alpha/|
        ^v8\.3_institutional/src/factors/five_factor\.py$|
        (?:^|/)qlib/|
        qlib/utils/time\.py|
        ^skills/ifind-finance-data/|
        ^ifind-finance-data-1\.3\.0/|
        ^cache/|
        ^build/|
        ^dist/|
        ^\.venv/|
        ^unsloth_compiled_cache/|
        ^external/|
        ^_test_report_20260830/|
        ^_archive/|
        ^backups/|
        ^third_party/|
        ^lgb_trainer/|
        ^utils/ifind_client\.py$|
        ^system_integration\.py$|
        ^[^/]*v8\.6\.py$|
        ^v8\.3_institutional/daily_workflow\.py$
    )

# Third-party libs without type stubs: ignore
ignore_missing_imports = True
# Tolerate import-untyped env noise (not CI-blocking)
disable_error_code = import-untyped

# Third-party qlib: syntax incompatible with current mypy Python target, ignore whole package
[mypy-qlib.*]
ignore_errors = True
[mypy-qlib.utils.time]
ignore_errors = True

# Module-specific overrides
[mypy-utils.*]
# Core trading module: strict check
check_untyped_defs = True
warn_return_any = True

# P5 (2026-09-07): pipeline_signal_mixin -- Mixin accessing host class (InstitutionalPipeline)
# attrs (data_provider/ctx/_get_or_load_historical/_lgb_get_signal), mypy cannot model mixin
# composition -> attr-defined; host class already under [mypy-institutional_pipeline_runner]
# ignore_errors, mixin is same-nature limitation; precise disable_error_code (not ignore_errors,
# keeps other error detection active)
[mypy-utils.pipeline_signal_mixin]
disable_error_code = attr-defined

# P6 (2026-09-07): pipeline_report_mixin -- same Mixin pattern as pipeline_signal_mixin,
# accesses host class attrs (ctx/decision/etc); precise disable_error_code (not ignore_errors)
[mypy-utils.pipeline_report_mixin]
disable_error_code = attr-defined

# Phase C (2026-08-20): new modules and core risk modules enable disallow_any_generics
[mypy-utils.observability.*]
# Phase B observability new modules: full strict
disallow_any_generics = True
warn_return_any = True
check_untyped_defs = True
disallow_untyped_defs = True

[mypy-utils.risk.*]
# Risk core modules: enable disallow_any_generics (Phase C C2)
disallow_any_generics = True
warn_return_any = True
check_untyped_defs = True

[mypy-utils.config_manager]
# ConfigManager: strictest (new code example)
# Phase 3-D: disallow_untyped_defs = True
disallow_untyped_defs = False
warn_return_any = True

[mypy-utils.kill_switch]
# KillSwitch: core risk control, strict check
check_untyped_defs = True

[mypy-utils.portfolio_optimizer]
# PortfolioOptimizer: core capital management
check_untyped_defs = True

[mypy-v8.3_institutional.daily_workflow]
# Main workflow: large codebase (8300+ lines), Phase 3-C progressive tighten
# Phase 3-B fixed key bugs: log_dir/pd/EnvironmentIsolation.validate/ExecutionSlice.shares/return True
# Remaining errors are Optional inference and dynamic attrs, not bugs; defer to Phase 3-C
check_untyped_defs = False
warn_return_any = False
no_implicit_optional = False
ignore_errors = True

# ============================================================
# P0 root files (CODE_REVIEW_PLAN Task 2.1)
# These are dynamic entry scripts (if __name__ == "__main__" pattern).
# Currently error-heavy; scanned but ignore_errors tolerant (warning level),
# tighten per-file later then remove ignore_errors to error-blocking.
# Enable: add these files to ci.yml mypy job scan paths.
# ============================================================
[mypy-daily_trade_executor]
ignore_errors = True
[mypy-institutional_pipeline_runner]
ignore_errors = True
[mypy-rebalance_execution_orders]
ignore_errors = True
[mypy-hedge_execution_orders]
ignore_errors = True
[mypy-alpha_hedge_engine]
ignore_errors = True
[mypy-build_plan_executor]
ignore_errors = True
[mypy-daily_build_and_hedge]
ignore_errors = True
[mypy-live_scheduler]
ignore_errors = True
[mypy-run_daily_eod]
ignore_errors = True
[mypy-signal_monitor]
ignore_errors = True
[mypy-signal_post_processing]
ignore_errors = True
[mypy-stop_loss_monitor]
ignore_errors = True
[mypy-today_hedge_decision]
ignore_errors = True
[mypy-vol_adjusted_stop_loss]
ignore_errors = True
[mypy-hedge_quantity_calculator]
ignore_errors = True
