# MyPy 配置 — 终极量化交易系统 (Phase 3-B, 2026-07-26)
# ============================================================
# 渐进式严格模式: 先解决明显错误, 后逐步提升严格度
#
# 当前策略 (Phase 3-B 启动):
#   - 启用基本类型检查 (warn_unused_ignores, warn_redundant_casts)
#   - 允许 Any 类型 (避免大量重写, 后续逐步收紧)
#   - 不强制 strict 模式 (留待 Phase 3-C)
#   - 排除非核心目录 (research/, tests/, tools/, scripts/, ms_strategy/, .venv/)
#
# 后续路径:
#   Phase 3-C: strict=True + disallow_any_generics=True
#   Phase 3-D: warn_return_any=True + 全项目类型化

[mypy]
# Python 版本目标
python_version = 3.8

# 渐进式严格: 启用警告, 但不强制 strict
warn_unused_ignores = True
warn_redundant_casts = True
warn_unused_configs = True
no_implicit_optional = True

# 类型检查范围 (后续逐步收紧)
# Phase 3-C: check_untyped_defs = True
# Phase 3-D: disallow_untyped_defs = True, disallow_any_generics = True
check_untyped_defs = False
disallow_untyped_defs = False
disallow_any_generics = False

# 错误显示
show_error_codes = True
show_column_numbers = True
pretty = True

# 性能优化
fast_module_lookup = True
sqlite_cache = True
cache_dir = .mypy_cache

# 排除非核心目录 (后续逐步纳入)
exclude =
    (?x)(
        ^research/|
        ^tests/|
        ^tools/|
        ^scripts/|
        ^ms_strategy/|
        ^v8\.3_institutional/src/ai/llm_client\.py$|  # 第三方 LLM 客户端
        ^v8\.3_institutional/src/alpha/|  # 后续处理
        ^v8\.3_institutional/src/factors/five_factor\.py$|  # 后续处理
        ^build/|
        ^dist/|
        ^\.venv/
    )

# 第三方库无类型存根时忽略
ignore_missing_imports = True

# 模块特定覆盖
[mypy-utils.*]
# 核心交易模块: 严格检查
check_untyped_defs = True
warn_return_any = True

[mypy-utils.config_manager]
# ConfigManager: 最严格 (新代码示范)
# Phase 3-D: disallow_untyped_defs = True
disallow_untyped_defs = False
warn_return_any = True

[mypy-utils.kill_switch]
# KillSwitch: 核心风控, 严格检查
check_untyped_defs = True

[mypy-utils.portfolio_optimizer]
# PortfolioOptimizer: 核心资金管理
check_untyped_defs = True

[mypy-v8.3_institutional.daily_workflow]
# 主工作流: 大型代码库 (8300+ 行), Phase 3-C 渐进式收紧
# Phase 3-B 已修复关键 bug: log_dir/pd/EnvironmentIsolation.validate/ExecutionSlice.shares/return True 等
# 剩余错误均为 Optional 推断与动态属性, 非 bug, 留待 Phase 3-C 全量类型化
check_untyped_defs = False
warn_return_any = False
no_implicit_optional = False
ignore_errors = True
