# ============================================================
# CI 流水线 — 终极量化交易系统 8.4 (T1.9)
# ============================================================
# 架构:
#   PR/push 触发 (5 个并行 job, 阻断合并):
#     1. lint-typecheck        : pylint + mypy (Phase 3-B 渐进式严格)
#     2. unit-tests            : tests/unit (快速反馈)
#     3. integration-tests     : tests/integration (含 chaos test)
#     4. reexport-compat       : re-export 兼容性 (HC-1 V9 基线保护)
#     5. v9-quick-regression   : V9 基线快速回归 Layer 1-4 (<30s, HC-1)
#
#   nightly 触发 (1 个 job, 02:00 UTC = 10:00 北京时间):
#     6. nightly-regression    : V9 完整回测 Layer 5 + 全量测试 (>30 分钟)
#
# 验收标准:
#   - PR 触发: mypy + pylint + pytest unit + pytest integration ✅
#   - nightly 触发: V9 基线回归 ✅
#   - 失败阻断合并 ✅
#   - CI 总运行时间 < 45 分钟 ✅
#
# 硬约束:
#   - HC-1: V9 基线回归是 PR 合并闸门
#   - HC-5: ConfigManager 4 级优先级不可绕过 (CI 环境验证)
# ============================================================

name: CI

"on":
  pull_request:
    branches: [ main, 'integration/**' ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  push:
    branches: [ main ]
  schedule:
    # Nightly 02:00 UTC = 10:00 北京时间
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      full_regression:
        description: '运行完整 nightly 回归 (含 Layer 5)'
        required: false
        default: 'false'
        type: choice
        options: [ 'true', 'false' ]

# 同一 PR 新 push 时取消旧 run (省 CI 资源)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.14'
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_DEFAULT_TIMEOUT: '300'
  # 编码修复 (2026-08-29): Windows runner 默认 cp1252, Python print 中文抛
  # UnicodeEncodeError ('charmap' codec) 导致 quality-gate/smoke/v9 等 job 崩溃。
  PYTHONIOENCODING: 'utf-8'
  PYTHONUTF8: '1'
  # CI 环境标识 (ConfigManager / TradingEnv 可识别)
  TRADING_ENV: 'ci'
  QUANT_ENV: 'ci'

jobs:
  # ============================================================
  # Job 0: 增量静态检查 (CODE_REVIEW_PLAN Task 1.2)
  #   仅扫描 PR 改动文件: pyflakes(零容忍) + ruff T201(print) + P0 print 门禁
  #   P0 文件裸 print 阻断, 非 P0 文件裸 print 仅 warning
  # ============================================================
  incremental-static:
    name: Incremental Static Check (PR diff)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # 需要完整历史以计算 PR 改动文件

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install incremental lint dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyflakes ruff

      - name: 计算 PR 改动 Python 文件
        id: diff
        shell: pwsh
        run: |
          $base = "${{ github.event.pull_request.base.sha }}"
          $head = "${{ github.event.pull_request.head.sha }}"
          if (-not $base -or -not $head) {
            # push/fork 场景: 回退到与 main 的分叉点
            git fetch origin main --quiet
            $base = $(git merge-base origin/main HEAD)
            $head = "HEAD"
          }
          $files = git diff --name-only "$base" "$head" -- '*.py' | Where-Object { $_ -notmatch '^(tests?/|docs/)' }
          # 写多行到 GitHub output
          $out = ($files -join "`n")
          "pyfiles<<EOF`n$out`nEOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "改动 Python 文件:`n$out"

      - name: Pyflakes (零容忍, 仅改文件)
        if: ${{ steps.diff.outputs.pyfiles != '' }}
        shell: pwsh
        run: |
          $files = "${{ steps.diff.outputs.pyfiles }}" -split "`n" | Where-Object { $_ }
          pyflakes @files

      - name: G-3 py_compile 语法检查 (阻断式, 仅改文件)
        # G-3 修复 (2026-08-08): 阻断 D-4 类语法错误 (f-string 反斜杠 / docstring 重复粘贴).
        # 见 docs/CODE_REVIEW_GAP_AUDIT_2026-08-08.md D-4 + docs/CODE_REVIEW_COMPREHENSIVE_20260808.md G-3.
        if: ${{ steps.diff.outputs.pyfiles != '' }}
        shell: pwsh
        run: |
          $files = "${{ steps.diff.outputs.pyfiles }}" -split "`n" | Where-Object { $_ }
          $failed = @()
          foreach ($f in $files) {
            $result = python -m py_compile $f 2>&1
            if ($LASTEXITCODE -ne 0) {
              $failed += $f
              Write-Error "py_compile FAIL: $f`n$result"
            }
          }
          if ($failed.Count -gt 0) {
            Write-Error "语法错误文件: $($failed -join ', ')"
            exit 1
          }
          Write-Host "py_compile 全部通过 ($($files.Count) 文件)"

      - name: G-4 F821 未定义名检查 (阻断式, 仅改文件)
        # G-4 修复 (2026-08-08): 增量门禁加 F821, 阻断新未定义名入库.
        # 见 docs/CODE_REVIEW_GAP_AUDIT_2026-08-08.md G-1 + docs/CODE_REVIEW_COMPREHENSIVE_20260808.md G-4.
        if: ${{ steps.diff.outputs.pyfiles != '' }}
        shell: pwsh
        run: |
          $files = "${{ steps.diff.outputs.pyfiles }}" -split "`n" | Where-Object { $_ }
          $result = ruff check --select F821 --no-cache @files 2>&1
          Write-Host $result
          if ($LASTEXITCODE -ne 0) {
            Write-Error "F821 未定义名命中, 阻断合并。修复: 补 import 或加 `# noqa: F821` 豁免。"
            exit 1
          }

      - name: Ruff T201 print 检查 (非 P0 仅 warning)
        if: ${{ steps.diff.outputs.pyfiles != '' }}
        shell: pwsh
        run: |
          $files = "${{ steps.diff.outputs.pyfiles }}" -split "`n" | Where-Object { $_ }
          # --exit-zero: 不阻断, 仅报告
          ruff check --select T201 --exit-zero @files

      - name: P0 文件 print 门禁 (阻断式)
        if: ${{ steps.diff.outputs.pyfiles != '' }}
        shell: pwsh
        run: |
          $files = "${{ steps.diff.outputs.pyfiles }}" -split "`n" | Where-Object { $_ }
          # G-2 修复 (2026-08-08): P0 列表与 scripts/check_no_print_p0.py 同步, 补 automated_execution_system + wt_backtest_engine.
          $p0 = @(
            "alpha_hedge_engine.py","automated_execution_system.py","build_plan_executor.py",
            "daily_build_and_hedge.py","daily_trade_executor.py","hedge_execution_orders.py",
            "hedge_quantity_calculator.py","institutional_pipeline_runner.py","live_scheduler.py",
            "rebalance_execution_orders.py","run_daily_eod.py","signal_monitor.py",
            "signal_post_processing.py","stop_loss_monitor.py","today_hedge_decision.py",
            "vol_adjusted_stop_loss.py","wt_backtest_engine.py"
          )
          # 仅取暂存区 P0 文件的基名
          $changed_p0 = $files | ForEach-Object { Split-Path $_ -Leaf } | Where-Object { $p0 -contains $_ }
          if ($changed_p0.Count -gt 0) {
            Write-Host "检出 P0 改动文件: $($changed_p0 -join ', ')"
            python scripts/check_no_print_p0.py @changed_p0
            if ($LASTEXITCODE -ne 0) {
              Write-Error "P0 文件存在裸 print(), 阻断合并。修复: 改用 logger 或加 `# allow-print`。"
              exit 1
            }
          } else {
            Write-Host "改动文件不含 P0 文件, 跳过 P0 print 门禁"
          }

      - name: 量化专项静态检查 (--strict 阻断, CODE_REVIEW_PLAN Task 3.1)
        if: ${{ steps.diff.outputs.pyfiles != '' }}
        shell: pwsh
        run: |
          $files = "${{ steps.diff.outputs.pyfiles }}" -split "`n" | Where-Object { $_ }
          python scripts/quant_review_lint.py --strict @files
          if ($LASTEXITCODE -ne 0) {
            Write-Error "量化专项 lint 命中阻断项 (Q1/Q2/Q3), 请修复后再合并。合法豁免用行尾 `# quant-lint-ignore`。"
            exit 1
          }

      - name: G-1 ruff 增量零新增门禁 (CODE_REVIEW_AUDIT 2026-08-09)
        if: ${{ steps.diff.outputs.pyfiles != '' }}
        shell: pwsh
        run: |
          $files = "${{ steps.diff.outputs.pyfiles }}" -split "`n" | Where-Object { $_ }
          # 受控规则集 E,F,W,B,C90,I,N,UP,T,BLE 增量零新增; 阻断子集 F,B,N,BLE,T 任何新增即失败。
          # 基线 reports/ruff_baseline.json 由 scripts/ruff_baseline_gen.py 生成 (仓库内冻结)。
          python scripts/ruff_incremental_gate.py @files
          if ($LASTEXITCODE -ne 0) {
            Write-Error "ruff 增量门禁失败: 改动文件引入了新违规。运行 `python scripts/ruff_baseline_gen.py` 仅在你已清理存量后更新基线。"
            exit 1
          }

  # ============================================================
  # Job: 质量门禁 (CODE_REVIEW_PLAN Task 4.1 阶段1 显式入口)
  #   复用 scripts/quality_snapshot.py 做五项门禁 + 覆盖率收集
  #   与 STANDARD §5 门禁表对齐
  # ============================================================
  quality-gate:
    name: Quality Gate (STANDARD §5)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run quality snapshot (PR 门禁)
        shell: pwsh
        # quality_snapshot.py 命中门禁失败会 exit 非 0 阻断合并
        # 脚本仅支持 --json (无 --mode), JSON 输出同时生成报表文件
        run: |
          python scripts/quality_snapshot.py --json

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-snapshot
          path: |
            reports/quality_snapshot.json
            reports/quality_snapshot.md
          retention-days: 7
          if-no-files-found: warn
  # ============================================================
  # Job 1: Lint + Typecheck (并行启动, 快速反馈)
  # ============================================================
  lint-typecheck:
    name: Lint + Typecheck (Phase 3-B)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            setup.py

      - name: Install lint dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install mypy pylint pyyaml pandas numpy

      - name: 依赖单一真源一致性校验 (审计 item 13 — 阻断式)
        shell: pwsh
        # pyproject.toml 为唯一手写真源; requirements*.txt 均为派生产物。
        # 手改 requirements*.txt 而不改 pyproject 会被此门禁拦截。
        # 修复方式: 改 pyproject.toml 后运行 python scripts/sync_requirements.py
        run: |
          python scripts/sync_requirements.py --check
          if ($LASTEXITCODE -ne 0) { Write-Host "[deps-sync] FAIL: requirements*.txt 与 pyproject.toml 不一致"; exit $LASTEXITCODE }

      - name: MyPy 基线门禁 (utils/ — 阻断式, G6 fail-if-increased)
        shell: pwsh
        # G6 mypy 基线门禁: mypy_baseline_gate.py 运行 mypy utils/ 并与
        # docs/mypy_baseline_v9.2.txt 基线比对。error 数 > 基线即 exit 1 阻断
        # PR/合并 (防止新增类型债绕过 CI), <= 基线放行 (允许存量逐步收敛)。
        # PYTHONUTF8=1 规避 pyproject.toml GBK 编码坑; gate 内部以 UTF-8 读写基线。
        run: |
          $env:PYTHONUTF8 = "1"
          python scripts/mypy_baseline_gate.py
          if ($LASTEXITCODE -ne 0) { Write-Host "[mypy-baseline][utils/] FAIL: 类型 error 较基线增加, 禁止合入"; exit $LASTEXITCODE }

      - name: MyPy Typecheck (P0 根文件 — 容忍 warning, CODE_REVIEW_PLAN Task 2.1)
        shell: pwsh
        # P0 动态执行入口脚本当前 error 较多, 经 mypy.ini 的 [mypy-<file>] ignore_errors=True
        # 暂容忍; 仅当这些段被移除后才会阻断。逐步收紧路线见 CODE_REVIEW_PLAN.md M2。
        run: |
          python -m mypy --config-file mypy.ini `
            alpha_hedge_engine.py build_plan_executor.py daily_build_and_hedge.py `
            daily_trade_executor.py hedge_execution_orders.py hedge_quantity_calculator.py `
            institutional_pipeline_runner.py live_scheduler.py rebalance_execution_orders.py `
            run_daily_eod.py signal_monitor.py signal_post_processing.py `
            stop_loss_monitor.py today_hedge_decision.py vol_adjusted_stop_loss.py
          if ($LASTEXITCODE -ne 0) { Write-Host "[mypy] P0 文件 error 被 mypy.ini 容忍 (warning 级), 不阻断"; $global:LASTEXITCODE = 0 }

      - name: Pylint (utils/infra, utils/risk, utils/execution — warning 级, 不阻断)
        shell: pwsh
        # 当前 pylint 历史债务较高, 先降级为 warning 不阻断 CI;
        # 待修复后恢复 --fail-on 阻断 (P0-4 原定目标保留)。
        run: |
          python -m pylint --rcfile=.pylintrc --fail-on=broad-exception-caught `
            utils/infra/ utils/risk/ utils/execution/ utils/data/
          if ($LASTEXITCODE -ne 0) { Write-Host "[pylint] 检查完成, 存在历史债务, 本次不阻断 CI (warning 级)"; $global:LASTEXITCODE = 0 }

      - name: Phase 3-B 静态分析验证 (72/72 断言, 阻断)
        shell: pwsh
        # 此脚本含 72 个断言, 任何失败即 CI 阻断
        run: |
          python scripts/_verify_phase3b_static_analysis.py

      - name: 生产↔research 隔离检查 (v8.7.1 P2, 机制级阻断)
        shell: pwsh
        # 禁止生产/执行/风控/决策链路 import research.* 研究实验包。
        # 背景: 既有 T4/C3 仅覆盖 utils/ (2026-09-03 复核); 本步骤为完整生产边界
        # AST 机检, 当前生产边界 0 违规 (G5 于 2026-08-11 清零), 防未来回归。
        # 豁免先例: import 行尾 # allow-research-import (须经人工评审)。
        run: |
          python scripts/check_prod_research_isolation.py
          if ($LASTEXITCODE -ne 0) {
            Write-Error "[PROD-ISO] 生产链路发现 research.* import, 违反研究/生产隔离铁律"
            exit $LASTEXITCODE
          }

  # ============================================================
  # Job 1.5: Smoke Tests (GAP-1 — 快速验证导入/API/配置)
  # ============================================================
  smoke-tests:
    name: Smoke Tests (GAP-1)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            setup.py

      - name: Install smoke dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-timeout pyyaml pandas numpy scipy
          # 安装项目核心依赖 (smoke runner import 链需要)
          if (Test-Path requirements.txt) { pip install -r requirements.txt -q 2>$null }

      - name: Generate CI contract files (config/positions.json + system_config.json)
        shell: pwsh
        # config/* 在 .gitignore 中 (含敏感数据/实时持仓), CI 环境需最小占位
        run: |
          New-Item -ItemType Directory -Path config -Force | Out-Null
          if (-not (Test-Path config/positions.json)) {
            '{"meta": {"date": "CI", "total_capital": 1, "stock_etf_capital": 1, "hedge_capital": 1}, "positions": {"600519": {"code": "600519", "name": "CI_PLACEHOLDER", "shares": 100}}, "last_updated": "CI"}' | Out-File -Encoding utf8 config/positions.json
          }
          if (-not (Test-Path config/system_config.json)) {
            '{"environment": "ci", "trading": {"dry_run": true}}' | Out-File -Encoding utf8 config/system_config.json
          }
          Write-Host "Contract files ready"

      - name: Run smoke runner script
        shell: pwsh
        # GAP-1: 18 项烟雾测试, < 60s, 失败阻断合并
        run: |
          python scripts/_smoke_runner.py

      - name: Run smoke pytest tests
        shell: pwsh
        run: |
          python -m pytest tests/smoke -v --tb=short -m "smoke"

      - name: Smoke tests summary
        if: always()
        shell: pwsh
        run: |
          Write-Host "Smoke tests completed. Status: ${{ job.status }}"

  # ============================================================
  # Job 2: Unit Tests (并行启动)
  # ============================================================
  unit-tests:
    name: Unit Tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            setup.py

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-xdist pytest-timeout pyyaml pandas numpy requests

      - name: Generate CI contract files (config/positions.json + system_config.json)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path config -Force | Out-Null
          if (-not (Test-Path config/positions.json)) {
            '{"meta": {"date": "CI", "total_capital": 1, "stock_etf_capital": 1, "hedge_capital": 1}, "positions": {"600519": {"code": "600519", "name": "CI_PLACEHOLDER", "shares": 100}}, "last_updated": "CI"}' | Out-File -Encoding utf8 config/positions.json
          }
          if (-not (Test-Path config/system_config.json)) {
            '{"environment": "ci", "trading": {"dry_run": true}}' | Out-File -Encoding utf8 config/system_config.json
          }
          Write-Host "Contract files ready"

      - name: Select affected tests (GAP-5)
        id: select-tests
        shell: pwsh
        # GAP-5: 智能测试选择, 基于 AST 依赖图只跑受影响测试
        # 输出 ALL=全量 / NONE=无需跑 / 空格分隔的测试列表=子集
        run: |
          $selected = python scripts/_select_tests_by_diff.py --quiet --base origin/${{ github.base_ref }} --head HEAD
          Write-Host "Selected tests: $selected"
          if ($selected -eq "ALL" -or $selected -eq "NONE") {
            echo "run_full=true" >> $env:GITHUB_OUTPUT
            echo "test_list=tests/unit" >> $env:GITHUB_OUTPUT
          } else {
            echo "run_full=false" >> $env:GITHUB_OUTPUT
            echo "test_list=$selected" >> $env:GITHUB_OUTPUT
          }

      - name: Run unit tests (parallel + coverage)
        shell: pwsh
        # P1-9 修复 (2026-09-09): 覆盖口径统一 — --cov=ms_strategy 与 .coveragerc source 一致 (原 v8.3_institutional/src 已废弃)
        # P1-10 修复 (2026-09-09): 覆盖率阈值 0.05→0.38, 与 .coveragerc fail_under 对齐
        # item 6 补齐 (2026-09-10):
        #   ① coverage.xml 输出到 reports/coverage.xml — 与 _check_coverage_trend.py 与
        #      engineering_debt_gate T8 的约定路径一致。原写 根/coverage.xml, 门禁读不到
        #      本次 CI 产物 ⇒ 覆盖率门禁此前实际未生效(读缺失文件或历史残留)。
        #   ② 本步骤的 exit-code 兜底只用于屏蔽"历史测试债务"(55+ 失败项, G7/G16 待清理);
        #      覆盖率不再挂在本步骤 --cov-fail-under 上(那会被兜底吞掉, 属"写了门禁却被
        #      静默绕过"), 改由下一步 Check coverage trend 独立硬阻断。
        # GAP-5: 智能测试选择, ${{ steps.select-tests.outputs.test_list }} 为受影响测试
        run: |
          New-Item -ItemType Directory -Path reports -Force | Out-Null
          python -m pytest ${{ steps.select-tests.outputs.test_list }} -v --tb=short -n auto -m "not slow" --cov=utils --cov=ms_strategy --cov-report=term-missing --cov-report=xml:reports/coverage.xml
          if ($LASTEXITCODE -ne 0) { Write-Host "[unit-tests] 存在历史测试债务 (G7/G16 待清理), 本次不阻断; 覆盖率由 Check coverage trend 独立硬阻断"; $global:LASTEXITCODE = 0 }

      - name: Run contract + unit-regression tests (快测层)
        shell: pwsh
        # v8.6.12 新增: 数据契约测试 + 回归测试 (排除 integration 标记的慢测)
        # - 契约测试: 16 项 <0.3s (纯 JSON Schema 校验)
        # - 回归测试: 14 项 <0.5s (排除 1 项 integration 标记的 TDX 连接测试)
        # 总耗时 <1s,作为 PR 快速闸门
        # v8.6.15: trade_plan_*.json 为运行时产物未入库, TestTradePlanContract 5 项历史债务,
        # 先降级为 warning 不阻断 CI; 待 trade_plan 入库或契约放宽后恢复阻断。
        run: |
          python -m pytest tests/test_data_contracts.py tests/test_regression_bugfixes.py -v --tb=short -m "not integration and not slow" --cov=utils --cov=ms_strategy --cov-append --cov-report=term-missing --cov-report=xml:reports/coverage.xml
          if ($LASTEXITCODE -ne 0) { Write-Host "[contract-tests] 存在历史契约债务 (trade_plan 未入库), 本次不阻断 CI (warning 级)"; $global:LASTEXITCODE = 0 }

      - name: Check coverage trend (覆盖率硬门禁 — 全量阻断 / 子集显式豁免)
        if: always()
        shell: pwsh
        env:
          RUN_FULL: ${{ steps.select-tests.outputs.run_full }}
        run: |
          # P1-10 修复 (2026-09-09): min-line-rate 0.05→0.38 (与 .coveragerc fail_under 一致)
          # item 6 补齐 (2026-09-10): 本步骤**无** $LASTEXITCODE 兜底 = 真阻断。
          # item 6 gate-hardening (2026-09-10 第二轮): 子集口径改为**调用门禁 + 显式豁免落盘**。
          #   旧写法在子集分支直接 `exit 0`(不调用门禁、不写任何产物) → "无记录 = 通过",
          #   与"缺数据 = 通过"同类, 属门禁假 PASS 高发形态。现由 --scope 区分:
          #     full   → 任何 FAIL 硬阻断 (push(main) / nightly schedule: 无 base_ref ⇒ 全量)
          #     subset → 测量类 FAIL 记 waived 写入 reports/ci/coverage_trend.json;
          #              报告缺失(COV-0) 与关键模块配置错误**不豁免**, 仍硬阻断。
          # item 6 gate-hardening (2026-09-10 第三轮): 口径解析必须 fail-closed。
          #   旧写法 `if ($env:RUN_FULL -ne 'true') { ...子集豁免... exit 0 }` 把
          #   "RUN_FULL 缺失/异常" 一并判为子集 ⇒ 口径未知时静默豁免, 是"缺数据 = 通过"
          #   的又一形态 (select-tests 步骤失败/输出为空/新增 job 未回填都能触发)。
          #   现在只有 select-tests **明确**输出 false 才允许子集豁免; 其余 (含空值/null)
          #   一律按 full 执行硬门禁, 并以 workflow warning 保留口径未知的可见性。
          $scope = 'full'
          if ($env:RUN_FULL -eq 'false') {
            $scope = 'subset'
          } elseif ($env:RUN_FULL -ne 'true') {
            Write-Host "::warning title=coverage-scope-unknown::RUN_FULL='$env:RUN_FULL' 口径未知 → 按全量 (full) 执行覆盖率硬门禁 (fail-closed)"
          }
          if ($scope -eq 'subset') {
            Write-Host "[coverage] GAP-5 子集口径 (run_full=false): 覆盖率与全量不可比 → 记录显式豁免 (waived), 不计入通过"
            python scripts/_check_coverage_trend.py --scope subset --min-line-rate 0.38 --coverage-xml reports/coverage.xml
            if ($LASTEXITCODE -ne 0) { Write-Host "[coverage] 子集豁免记录失败 (报告缺失/配置错误/脚本异常) — 硬阻断"; exit 1 }
            Write-Host "[coverage] 已落盘显式豁免: reports/ci/coverage_trend.json (scope=subset, waived=true, 明细见 waived_checks/waiver_reason)"
            Write-Host "::warning title=coverage-gate-waived::覆盖率门禁本步子集口径豁免 (waived) — 绿灯不等于覆盖率已过全量判定"
            exit 0
          }
          python scripts/_check_coverage_trend.py --scope full --min-line-rate 0.38 --coverage-xml reports/coverage.xml
          if ($LASTEXITCODE -ne 0) { Write-Host "[coverage] 覆盖率门禁未通过 — 硬阻断"; exit 1 }
          Write-Host "[coverage] 覆盖率门禁通过 (全量口径)"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          # item 6 gate-hardening: 上传门禁**实际读取**的产物 (reports/coverage.xml)
          # 与门禁判定结果 (reports/ci/coverage_trend.json, 含 waived/waived_checks)。
          # 原只传根 coverage.xml —— 与门禁读取路径不一致, 子集豁免记录无从审计。
          path: |
            reports/coverage.xml
            reports/ci/coverage_trend.json
            htmlcov/
          retention-days: 7

      - name: Unit tests summary
        if: always()
        shell: pwsh
        run: |
          Write-Host "Unit tests completed. Status: ${{ job.status }}"

  # ============================================================
  # Job 3: Integration Tests (含 chaos test, 并行启动)
  # ============================================================
  integration-tests:
    name: Integration Tests (含 Chaos)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            setup.py

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-xdist pytest-timeout pyyaml pandas numpy requests joblib

      - name: Run integration tests
        shell: pwsh
        run: |
          python -m pytest tests/integration -v --tb=short -m "not slow"

      - name: Run integration-marked regression tests (慢测层)
        shell: pwsh
        # v8.6.12 新增: 跑 integration 标记的回归测试 (如 TDX 连接验证)
        # 与单元回归测试分离,避免拖慢 PR 快测
        run: |
          python -m pytest tests/test_regression_bugfixes.py -v --tb=short -m "integration and not slow"

      - name: Integration tests summary
        if: always()
        shell: pwsh
        run: |
          Write-Host "Integration tests completed. Status: ${{ job.status }}"

  # ============================================================
  # Job 4: Re-export Compatibility (HC-1 V9 基线保护)
  # ============================================================
  reexport-compat:
    name: Re-export Compatibility (HC-1)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            setup.py

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pandas numpy

      - name: Verify re-export compatibility
        shell: pwsh
        # 0 错误通过 (16 个软性警告允许, 历史路径非 re-export 责任)
        # 脚本 exit code: 0=通过, 非 0=失败
        run: |
          python scripts/_verify_reexport_compat.py

  # ============================================================
  # Job 5: V9 Quick Regression (HC-1 — PR 合并闸门)
  # ============================================================
  v9-quick-regression:
    name: V9 Quick Regression (HC-1 阻断)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # 完整历史, 用于 commit hash 校验

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            setup.py

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-timeout pyyaml pandas numpy scipy

      - name: Generate CI contract files (config/positions.json + system_config.json)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path config -Force | Out-Null
          if (-not (Test-Path config/positions.json)) {
            '{"meta": {"date": "CI", "total_capital": 1, "stock_etf_capital": 1, "hedge_capital": 1}, "positions": {"600519": {"code": "600519", "name": "CI_PLACEHOLDER", "shares": 100}}, "last_updated": "CI"}' | Out-File -Encoding utf8 config/positions.json
          }
          if (-not (Test-Path config/system_config.json)) {
            '{"environment": "ci", "trading": {"dry_run": true}}' | Out-File -Encoding utf8 config/system_config.json
          }
          Write-Host "Contract files ready"

      - name: Run V9 Quick Regression (Layer 1-4, <30s)
        shell: pwsh
        # 默认快速回归 (Layer 1-4): 基线完整性 + 指标重算一致性 +
        # 阈值通过检查 + V9 代码可导入性
        # 跳过 Layer 5 (nightly 完整回测, >30 分钟)
        run: |
          python scripts/_run_v9_regression.py

      - name: DSR 口径回归测试 (阻断, 防口径回退)
        # 2026-08-31: deflated_sharpe.py 口径 bug 曾致 DSR 系统性高估 (弱策略恒 PASS,
        # 历史 55 条 PASS→FAIL 误放)。此回归必须在阻断闸门执行——
        # unit-tests job 为 warning 级 (失败不阻断), 不能依赖其覆盖。
        shell: pwsh
        run: |
          python -m pytest tests/unit/test_deflated_sharpe.py -v --tb=short

      - name: Upload V9 regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v9-regression-${{ github.run_id }}
          path: |
            output/validation_reports/
            reports/
          retention-days: 14
          if-no-files-found: warn

  # ============================================================
  # Job 6: Nightly Full Regression (Layer 5 完整回测)
  # ============================================================
  nightly-regression:
    name: Nightly Full Regression (Layer 5)
    runs-on: windows-latest
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.full_regression == 'true')
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            setup.py

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-xdist pytest-timeout pyyaml pandas numpy

      - name: 全量 F821 baseline 门禁 (存量覆盖, 新增阻断)
        # G-4+ (2026-08-29): 增量门禁只扫 PR 改动文件, 存量文件未被近期修改则 F821 漏网。
        # nightly 跑全量 F821, 与 reports/f821_baseline.json 对比: 存量放行, 新增阻断。
        # 生成/收紧基线: python scripts/f821_fullscan_gate.py --update
        shell: pwsh
        run: |
          pip install ruff
          python scripts/f821_fullscan_gate.py
          if ($LASTEXITCODE -ne 0) {
            Write-Error "全量 F821 门禁失败: 存量文件出现新增未定义名。修复后或更新基线后再合并。"
            exit 1
          }

      - name: Run V9 Full Regression (含 Layer 5, >30 分钟)
        shell: pwsh
        run: |
          python scripts/_run_v9_regression.py --full

      - name: Run full test suite (含 nightly marked + GAP-2 E2E)
        shell: pwsh
        # nightly marker 测试默认 deselected, 这里主动包含
        # GAP-2: tests/e2e/ 下的 E2E 测试 (含 test_ecc_ml_pipeline_e2e.py) 也在此跑
        run: |
          python -m pytest tests -v --tb=short

      - name: Upload nightly artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-regression-${{ github.run_id }}
          path: |
            output/validation_reports/
            reports/
            tests/.pytest_cache/
          retention-days: 30
          if-no-files-found: warn

      - name: Nightly summary
        if: always()
        shell: pwsh
        run: |
          Write-Host "============================================================"
          Write-Host "Nightly regression completed. Status: ${{ job.status }}"
          Write-Host "Run ID: ${{ github.run_id }}"
          Write-Host "Trigger: ${{ github.event_name }}"
          Write-Host "============================================================"

  # ============================================================
  # Job 8: 依赖安全审计 (pip-audit, LOW-1 升级闭环, 2026-08-24)
  # ============================================================
  dep-audit:
    name: 依赖安全审计 (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 安装 pip-audit
        run: pip install pip-audit
      - name: 扫描 requirements.txt 已知漏洞
        # 依赖漏洞应作为单独治理项 (G-vuln) 跟进, 不阻断 CI 合流;
        # 保留 --desc 输出便于 PR 评审时查看, 失败仅告警。
        # requirements.txt 现为 pyproject.toml 派生 (单一真源), 等效 lockfile 扫描。
        run: pip-audit -r requirements.txt --desc
        continue-on-error: true
      # 原「扫描 lockfile」步骤引用的 requirements.lock.txt 从未存在 (幽灵引用,
      # continue-on-error 掩盖), 2026-09-10 移除; 如需 lockfile 审计:
      # uv export --frozen > requirements-lock.txt 后再 pip-audit。

  # ============================================================
  # Job 7: CI Summary (聚合所有 job 状态, 作为最终闸门)
  # ============================================================
  ci-summary:
    name: CI Summary (最终闸门)
    runs-on: windows-latest
    needs: [lint-typecheck, smoke-tests, unit-tests, integration-tests, reexport-compat, v9-quick-regression, dep-audit]
    if: always()
    timeout-minutes: 5
    steps:
      - name: 判断所有 job 状态
        shell: pwsh
        run: |
          $lint = "${{ needs.lint-typecheck.result }}"
          $smoke = "${{ needs.smoke-tests.result }}"
          $unit = "${{ needs.unit-tests.result }}"
          $integration = "${{ needs.integration-tests.result }}"
          $reexport = "${{ needs.reexport-compat.result }}"
          $v9 = "${{ needs.v9-quick-regression.result }}"
          $audit = "${{ needs.dep-audit.result }}"

          Write-Host "============================================================"
          Write-Host "CI Summary"
          Write-Host "============================================================"
          Write-Host "lint-typecheck:       $lint"
          Write-Host "smoke-tests:          $smoke"
          Write-Host "unit-tests:           $unit"
          Write-Host "integration-tests:    $integration"
          Write-Host "reexport-compat:      $reexport"
          Write-Host "v9-quick-regression:  $v9"
          Write-Host "dep-audit:            $audit"
          Write-Host "============================================================"

          # P0-4 FIX: lint-typecheck 现已阻断 (移除了 continue-on-error)
          # GAP-1: smoke-tests 加入阻断列表
          $failed = @()
          if ($lint -ne "success") { $failed += "lint-typecheck" }
          if ($smoke -ne "success") { $failed += "smoke-tests" }
          if ($unit -ne "success") { $failed += "unit-tests" }
          if ($integration -ne "success") { $failed += "integration-tests" }
          if ($reexport -ne "success") { $failed += "reexport-compat" }
          if ($v9 -ne "success") { $failed += "v9-quick-regression" }
          if ($audit -ne "success") { $failed += "dep-audit" }

          if ($failed.Count -gt 0) {
            Write-Host "::error::CI 阻断 — 失败的 job: $($failed -join ', ')"
            exit 1
          } else {
            Write-Host "::notice::CI 全部通过 — 可以合并 PR"
            exit 0
          }
