name: Quality Gate (PR Incremental)

# R4 修复项：PR 增量质量门禁。
# 在每次 Pull Request 时运行，对变更文件执行增量检查：
#   1. ruff 增量零新增门禁 (scripts/ruff_incremental_gate.py)
#   2. P0 生产文件 print() 门禁 (scripts/check_no_print_p0.py)
#   3. 工作区变更数上限门禁 (<=100 未提交文件)
#   4. CI 引用完整性门禁 (scripts/ci_integrity_check.py)
#   5. bandit 安全扫描门禁 (中危即 FAIL)
# 任何一项失败都会阻断合并。

"on":
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  quality-gate:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # 需要完整 git 历史以计算 PR 增量

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest bandit
          # 2026-08-29: engineering_debt_gate 的 D1-D7 检查项需 import pandas/numpy/pyyaml,
          # 缺失时会被误判为 "模块不可用" (XX) 并把债务等级拉到 RED —— 是 CI 全红根因之一。
          pip install pandas numpy pyyaml

      - name: Get changed files
        id: changed-files
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            $base = "origin/${{ github.base_ref }}"
            git fetch origin ${{ github.base_ref }} --depth=1
          } else {
            $base = "HEAD~1"
          }
          $files = git diff --name-only --diff-filter=ACMR $base HEAD | Where-Object { $_ -match '\.py$' }
          $fileList = $files -join ' '
          Write-Output "changed_files=$fileList" >> $env:GITHUB_OUTPUT
          Write-Output "Changed Python files: $fileList"

      - name: Ruff incremental gate
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          $files = "${{ steps.changed-files.outputs.changed_files }}"
          if ([string]::IsNullOrWhiteSpace($files)) {
            Write-Output "[RUFF-GATE] No Python files changed, skip."
            exit 0
          }
          python scripts/ruff_incremental_gate.py $files

      - name: P0 print guard
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          $files = "${{ steps.changed-files.outputs.changed_files }}"
          if ([string]::IsNullOrWhiteSpace($files)) {
            Write-Output "[PRINT-GATE] No Python files changed, skip."
            exit 0
          }
          python scripts/check_no_print_p0.py $files

      - name: Lookahead bias guard (incremental, 2026-09-13 接入)
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          # ci_lookahead_guard 增量门禁: 对 PR 变更 .py 扫描前视偏差模式
          # (bfill/负位移/pct_change(-N)/train_test_split/全样本标准化)。
          # 此前该守卫从未接入 CI, 文档承诺的"每次提交自动扫描"不成立 (P0 修复)。
          $files = "${{ steps.changed-files.outputs.changed_files }}"
          if ([string]::IsNullOrWhiteSpace($files)) {
            Write-Output "[LOOKAHEAD-GUARD] No Python files changed, skip."
            exit 0
          }
          python ci_lookahead_guard.py --files "$files"
          if ($LASTEXITCODE -ne 0) {
            Write-Output "[LOOKAHEAD-GUARD][FAIL] Lookahead-bias patterns detected in changed files"
            exit 1
          }

      - name: Workspace change count guard
        shell: pwsh
        run: |
          $max = 100
          # BUGFIX: (git status --short).Length 是字符串字符数, 不是文件数
          $changed = (git status --short | Measure-Object -Line).Lines
          Write-Output "[WORKSPACE-GATE] changed/untracked files: $changed (max $max)"
          if ($changed -gt $max) {
            Write-Output "[WORKSPACE-GATE][FAIL] too many uncommitted changes ($changed > $max)"
            exit 1
          }

      - name: CI integrity check
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          python scripts/ci_integrity_check.py --strict

      - name: Lookahead bias guard (P0-6)
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          # P0-6 (2026-09-13): 前视偏差守护接入 CI — bfill/负位移/train_test_split/
          # 全样本标准化。CRITICAL 阻断, HIGH/MEDIUM 告警 (CI_LOOKAHEAD_STRICT=1 阻断)。
          Write-Output "[LOOKAHEAD-GUARD] Running ci_lookahead_guard.py (full scan)..."
          python ci_lookahead_guard.py
          exit $LASTEXITCODE

      - name: Bandit security gate
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          $files = "${{ steps.changed-files.outputs.changed_files }}"
          if ([string]::IsNullOrWhiteSpace($files)) {
            Write-Output "[BANDIT-GATE] No Python files changed, skip."
            exit 0
          }
          Write-Output "[BANDIT-GATE] Scanning changed files for security issues..."
          bandit -c bandit.yaml -r $files.split(' ') -ll -ii
          if ($LASTEXITCODE -ne 0) {
            Write-Output "[BANDIT-GATE][FAIL] Medium+ severity security issues detected"
            exit 1
          }
          Write-Output "[BANDIT-GATE] PASS - No medium+ severity issues"

      - name: LLM-to-exec boundary detection (AUTO-2, non-blocking)
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          # 检测性 (非阻断): 防未来新增 "LLM->执行" 直连回归。
          # 规范: docs/LLM权限边界规范.md (AUTO-2)
          Write-Output "[LLM-BOUNDARY] Running check_llm_exec_boundary.py (detection only, non-blocking)..."
          python scripts/check_llm_exec_boundary.py
          $code = $LASTEXITCODE
          # 脚本恒返回 0; 保留 exit 0 以显式保证非阻断
          Write-Output "[LLM-BOUNDARY] Detection complete (exit $code). Non-blocking."
          exit 0

      - name: Engineering debt gate (D9+D10+D11 + v8.7 summary)
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          Write-Output "[DEBT-GATE] Running engineering_debt_gate.py (D9 coverage / D10 file split / D11 PhaseB stable + v8.7 summary)..."
          python scripts/engineering_debt_gate.py
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            Write-Output "[DEBT-GATE] PASS - GREEN, all gates passed"
          } elseif ($code -eq 1) {
            Write-Output "[DEBT-GATE] WARN - YELLOW, proceed with caution"
            # PS 7.4+: pwsh -Command 会把最后 native 命令 (python rc=1) 的
            # $LASTEXITCODE 传播为步骤退出码, YELLOW 分支必须显式 exit 0
            exit 0
          } else {
            Write-Output "[DEBT-GATE][FAIL] RED - blocking issues detected (exit code $code)"
            exit 1
          }
