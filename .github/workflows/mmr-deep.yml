name: MMR Deep Review (文档 + 数据结论)

# L4 全评审: 对 docs/ cairn/ reports/*.json 变更做三模型全评审
# 量化特化: reports/*.json 走 data-claim lens (回测/压力测试/季度复盘结论审查)
# 触发: PR 中 .md 或 reports/*.json 变更 + 周度手动 dispatch
# Secrets: OCR_LLM_AUTH_TOKEN (GLM), DEEPSEEK_API_KEY

"on":
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]
    paths:
      - 'docs/**/*.md'
      - 'cairn/**/*.md'
      - 'reports/eod_guard_report_*.json'
      - 'reports/quarterly_review_*.json'
      - 'reports/stress_test_*.json'
      - 'reports/rebalance_execution_orders_*.json'
  workflow_dispatch:
    inputs:
      target:
        description: '审查目标 (docs|data|all)'
        required: false
        default: 'all'

permissions:
  contents: read
  pull-requests: write

jobs:
  mmr-deep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # 原生 git diff 替代 tj-actions/changed-files (第三方 action 依赖与权限风险)
      # 输出契约保持兼容: any_changed (true/false) + all_changed_files (空格分隔)
      - name: Get changed files
        id: changed
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="HEAD^"
          fi

          # 兜底: base 不存在 (首次提交/浅克隆) 时对比空树, 退化为全量文件
          if ! git rev-parse --verify "$BASE" >/dev/null 2>&1; then
            BASE="$(git hash-object -t tree /dev/null)"
          fi

          files=$(git diff --name-only "$BASE" HEAD \
            | grep -E '^(docs/.+\.md|cairn/.+\.md|reports/(eod_guard_report_|quarterly_review_|stress_test_|rebalance_execution_orders_).+\.json)$' \
            | grep -v '^cairn/Reference/' || true)

          echo "all_changed_files=$files" >> "$GITHUB_OUTPUT"
          if [ -n "$files" ]; then
            echo "any_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "any_changed=false" >> "$GITHUB_OUTPUT"
          fi

          echo "base=$BASE"
          echo "检测到待审查文件: ${files:-<none>}"

      - name: Classify and run mmr deep review
        if: steps.changed.outputs.any_changed == 'true'
        env:
          PYTHONUTF8: "1"
          BIGMODEL_API_KEY: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # 经 env 传递避免 bash 双引号作用域问题: python -c 的脚本整体包在 bash
          # 双引号里, 内嵌双引号会被 bash 切断 (曾致 pr_num = manual 裸标识符)
          PR_NUM: ${{ github.event.pull_request.number || 'manual' }}
        run: |
          # run_consensus 完整传递依赖链 (自动探测于 2026-09-01):
          # config_manager->yaml, providers->pandas, model_registry->joblib/lightgbm, omni_route_client->requests
          pip install -q pandas numpy pyyaml joblib lightgbm requests
          # openai 为可选依赖; 安装失败不阻断观测性审查
          pip install -q openai || echo "[MMR-DEEP] openai install skipped, proceeding anyway"
          mkdir -p reports/mmr_reviews/docs reports/mmr_reviews/data

          python -c "
          import json, sys, os, traceback
          from pathlib import Path
          sys.path.insert(0, '.')

          # mmr-deep 是观测性审查, 不应阻断 CI; 任何异常打印 traceback 后继续
          try:
              from utils.alpha.llm.consensus import run_consensus
              changed = '${{ steps.changed.outputs.all_changed_files }}'.split()
              pr_num = os.environ.get('PR_NUM', 'manual')

              doc_files = [f for f in changed if f.endswith('.md')]
              data_files = [f for f in changed if f.endswith('.json')]

              results = []

              for fpath in doc_files:
                  p = Path(fpath)
                  if not p.exists():
                      continue
                  artifact = p.read_text(encoding='utf-8')[:8000]
                  lens = 'architecture' if 'design' in fpath or 'plan' in fpath else 'product'
                  out = f'reports/mmr_reviews/docs/{p.stem}_pr{pr_num}.json'
                  r = run_consensus(artifact=artifact, lens=lens,
                                    models=['deepseek', 'glm'], judge_mode='vote',
                                    output_path=out)
                  results.append((fpath, lens, len(r.confirmed_findings), r.mode))

              for fpath in data_files:
                  p = Path(fpath)
                  if not p.exists():
                      continue
                  artifact = p.read_text(encoding='utf-8')[:8000]
                  out = f'reports/mmr_reviews/data/{p.stem}_pr{pr_num}.json'
                  r = run_consensus(artifact=artifact, lens='data-claim',
                                    models=['deepseek', 'glm'], judge_mode='vote',
                                    output_path=out)
                  results.append((fpath, 'data-claim', len(r.confirmed_findings), r.mode))

              print('=== MMR Deep Review Summary ===')
              for fpath, lens, confirmed, mode in results:
                  print(f'  {fpath} | lens={lens} | confirmed={confirmed} | mode={mode}')
              print(f'Total: {len(results)} artifacts reviewed')
          except Exception as exc:
              print(f'[MMR-DEEP][WARN] 审查步骤异常, 降级为空结果: {exc}', file=sys.stderr)
              traceback.print_exc()
              print('=== MMR Deep Review Summary ===')
              print('Total: 0 artifacts reviewed (degraded due to error)')
          "

      - name: Upload mmr deep artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mmr-deep-${{ github.event.pull_request.number || 'manual' }}
          path: |
            reports/mmr_reviews/docs/*.json
            reports/mmr_reviews/data/*.json
          retention-days: 30

      - name: Comment PR with mmr deep summary
        if: always() && github.event_name == 'pull_request' && steps.changed.outputs.any_changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dirs = ['reports/mmr_reviews/docs', 'reports/mmr_reviews/data'];
            let total = 0, confirmed = 0;
            const details = [];
            for (const dir of dirs) {
              if (!fs.existsSync(dir)) continue;
              for (const f of fs.readdirSync(dir)) {
                if (!f.endsWith('.json')) continue;
                const r = JSON.parse(fs.readFileSync(path.join(dir, f), 'utf8'));
                const c = (r.findings || []).length;
                total += (r.discoveries_count || 0);
                confirmed += c;
                if (c > 0) details.push(`- ${f}: ${c} confirmed (${r.lens})`);
              }
            }
            const body = [
              '## MMR Deep Review Summary (L4 文档+数据结论)',
              '',
              `| Metric | Count |`,
              `|--------|-------|`,
              `| 审查制品数 | ${total} |`,
              `| **Confirmed 发现** | **${confirmed}** |`,
              '',
              details.length > 0 ? '**Confirmed 详情:**\n' + details.join('\n') : '无 confirmed 发现。',
              '',
              `Powered by DeepSeek + GLM 双模型投票 (data-claim lens for reports/*.json)`
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
