    name: "一级警戒线"
    trigger:
      margin_usage_ratio: 0.50
    action:
      - "切断所有新开仓权限"
      - "进入'只平仓不计数'防守模式"
    auto_execute: true

  level_2:
    name: "二级熔断线"
    trigger:
      margin_usage_ratio: 0.75
    action:
      - "触发紧急自救协议"
      - "API中控强制平仓最深虚值期权空头"
      - "瞬间释放账户流动性"
    auto_execute: true

  level_3:
    name: "三级互盲机制"
    trigger:
      margin_call_extreme: true
    action:
      - "日内自动闪电变现10%高流动性红利低波ETF"
      - "跨品种清算注入期权账户"
      - "绝对确保期权端不被券商恶意强平"
    auto_execute: true
    source_etfs: ["512890", "515180"]

