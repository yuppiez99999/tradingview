hedge:
  # === 动态对冲策略 (v8.0核心升级) ===
  dynamic_hedge_policy:
    bull_market:
      hedge_ratio: 0.20
      max_contracts: 2
      description: "牛市: 降低对冲，保留上行收益"
    neutral_market:
      hedge_ratio: 0.40
      max_contracts: 3
      description: "中性: 中等对冲，平衡收益与风险"
    bear_market:
      hedge_ratio: 0.75
      max_contracts: 4
      description: "熊市: 提高对冲，保护下行风险"
    crisis_mode:
      hedge_ratio: 0.90
      max_contracts: 5
      description: "危机: 最大对冲，严格保护"

  # === 期货对冲 (Delta管理) ===
  futures:
    - instrument: "IF_futures"
      direction: "SELL"
      target_contracts: 3
      multiplier: 300
      margin_rate: 0.12
      role: "Delta管理"

  # === Gamma/Vega引擎 - 尾部危机防御 ===
  gamma_vega_engine:
    put_options:
      - instrument: "ETF_put_options"
        direction: "BUY"
        target_contracts: 20
        strike: "OTM_5%"
        premium_budget: 300000
      - instrument: "510050_put_options"
        direction: "BUY"
        target_contracts: 10
        strike: "OTM_5%"
        premium_budget: 120000
      - instrument: "159915_put_options"
        direction: "BUY"
        target_contracts: 10
        strike: "OTM_5%"
        premium_budget: 100000

    triggers:
      - name: "ma60_breakdown"
        condition: "大盘跌破60日均线"
        action: "自动加仓Deep OTM Put (行权价低于现价10%)"
        budget_ratio: 0.01
      - name: "iv_low_percentile"
        condition: "市场IV < 10%历史分位"
        action: "批量买入Deep OTM Put (权利金1-2%资产)"
        budget_ratio: 0.02
        iv_data_source: "Wind MCP option_data"

    gamma_explosion:
      target: "现货浮亏-120万 → 期权端+85万 → 净回撤-7%"
      max_drawdown_lock: 0.15

  # === Theta引擎 - 常态化备兑收租 ===
  theta_engine:
    enabled: true
    underlying_collateral: 4000000
    additional_margin_required: 0

    rolling:
      frequency: "monthly"
      dte_range: [20, 40]
      strike_otm_pct: [0.05, 0.08]
      option_type: "CALL"

    target_etfs:
      - code: "588080"
        weight_in_pool: 0.20
      - code: "512760"
        weight_in_pool: 0.15
      - code: "510050"
        weight_in_pool: 0.20
      - code: "515030"
        weight_in_pool: 0.15
      - code: "512170"
        weight_in_pool: 0.15
      - code: "518880"
        weight_in_pool: 0.15

    expected_enhancement:
      monthly_theta_target: [0.005, 0.008]
      annual_cashflow_boost: [0.06, 0.09]
      bull_market_drag: [-0.03, -0.05]

    risk_control:
      max_otm_call_ratio: 0.10
      min_dte: 15
      max_dte: 45
      auto_rollover: true

# === 三级熔断协议 (Kill Switch) ===
