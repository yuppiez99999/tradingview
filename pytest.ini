[pytest]
# ============================================================
# 量化交易系统 v8.6.7 测试金字塔配置
# ============================================================

# 测试路径: tests/ 主目录 + 三个子目录
testpaths =
    tests
    tests/unit
    tests/integration
    tests/e2e

# 测试文件命名规则
python_files = test_*.py verify_*.py
python_classes = Test*
python_functions = test_*

# 自定义标记 (与 conftest.py 中 pytest_configure 注册保持一致)
markers =
    slow: 标记慢速测试 (>5s)
    integration: 标记需要外部 API 的集成测试
    smoke: 标记冒烟测试 (核心路径)
    unit: 单元测试 (全 mock, <1s)
    e2e: 端到端测试 (真实历史数据)
    regression: 回归测试 (对应已修复的 bug 编号)
    p0: P0 致命级 bug 回归
    p1: P1 风险缺口级 bug 回归
    bug(id): 关联 bug 编号, 如 @pytest.mark.bug('P0-E')

# 最低 Python 版本
minversion = 7.3.0

# 严格标记 (未注册的标记会报错)
addopts =
    --strict-markers
    --strict-config
    -ra
    --tb=short
    --showlocals
    --color=yes

# 日志配置
log_cli = false
log_level = INFO
log_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_date_format = %Y-%m-%d %H:%M:%S

# 警告过滤
filterwarnings =
    ignore::DeprecationWarning:matplotlib.*
    ignore::PendingDeprecationWarning
    ignore::FutureWarning:pandas.*
    error::ResourceWarning
