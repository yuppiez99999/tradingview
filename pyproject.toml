# ============================================================
# 终极量化交易系统 v8.7 — pyproject.toml
# ============================================================
# Phase 0: 项目元数据 + 依赖声明 (从 requirements.txt 迁移)
# 兼容: pip install -e . 仍可用; uv sync 可用; requirements.txt 保留为 pip 回退
# ============================================================

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ultimate-quant-trading"
version = "8.7.0"
description = "A股量化交易系统 — 多因子选股、LightGBM增强训练、策略回测、风控管理"
readme = "README.md"
# P2 修复 (2026-09-09): requires-python >=3.10 下限未验证, CI/venv 仅用 3.14
# 待办: 加 CI 3.10/3.12 版本矩阵或收紧至 >=3.12
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "yuppiefree2025" }]

# ── 生产依赖 (单一真源; requirements*.txt 均由此生成, 见 scripts/sync_requirements.py) ──
# 关键决策注释 (原散落于各 requirements*.txt, 迁移至此):
#   - certifi>=2026.07.22: 锁定版本, where() 接口被移除会导致 6 个测试失败 (P1-4)
#   - pyautogui/pywinauto: 全仓零引用, 仅 ThsBrokerAdapter(mode="gui") 未实现分支
#     保留意图可追溯; 2027 确认废弃可连同该分支移除 (WIN_ONLY, 不进 core)
#   - duckdb: FeatureStore 离线层可选后端, 未安装自动降级 parquet (见 optional extras)
#   - 历次 SECURITY FIX (lightgbm RCE / sklearn 数据泄露 / requests / cryptography /
#     aiohttp / python-dotenv) 详见 git history: requirements.txt @ 2026-07-26/27
dependencies = [
    "numpy>=1.24.0",
    "pandas>=1.5.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.5.0",
    "xgboost>=1.5.0",
    "lightgbm>=4.6.0",
    "optuna>=3.0.0",
    "joblib>=1.2.0",
    "statsmodels>=0.13.0",
    "yfinance>=0.2.0",
    "akshare>=1.12.0",
    "requests>=2.33.0",
    "certifi>=2026.07.22",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "plotly>=5.15.0",
    "dash>=2.11.0",
    "python-dateutil>=2.8.0",
    "pytz>=2023.3",
    "PyYAML>=6.0",
    "python-dotenv>=1.2.2",
    "schedule>=1.2.0",
    "ntplib>=0.4.0",
    "pyautogui>=0.9.53",
    "pywinauto>=0.6.8",
    "PyPortfolioOpt>=1.5.0",
    "quantstats>=0.0.59",
    "sqlalchemy>=2.0.0",
    "aiohttp>=3.14.3",
    "cryptography>=50.0.0",
    "click>=8.1.0",
    "tqdm>=4.65.0",
    "numba>=0.57.0",
    "loguru>=0.7.0",
    # P2 修复 (2026-09-09): 以下 3 项在 requirements.txt 有但 pyproject.toml 漏登
    "streamlit>=1.30.0",
    "pydantic>=2.5.0",
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
# ── 开发依赖 (从 requirements_dev.txt 迁移) ──
dev = [
    "pytest>=7.3.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.10.0",
    "ruff>=0.6.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "isort>=5.12.0",
    "sphinx>=5.3.0",
    "sphinx-rtd-theme>=1.2.0",
    "pip-audit>=2.6.0",
    "bandit>=1.7.5",
    "memory-profiler>=0.61.0",
]
# ── AI Hedge Fund 多Agent框架 (v8.6+ 融合 TradingAgents-src v0.3.1) ──
# 安装: pip install -e .[ai-hedge]
ai-hedge = [
    "langchain-core>=0.3.81",
    "langchain-openai>=0.3.23",
    "langchain-anthropic>=0.3.15",
    "langchain-google-genai>=4.0.0",
    "langchain-experimental>=0.3.4",
    "langchain-ollama>=0.3.0",
    "langgraph>=0.4.8",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "stockstats>=0.6.5",
    "questionary>=2.1.0",
    "typer>=0.21.0",
    "parsel>=1.10.0",
    "redis>=6.2.0",
    "backtrader>=1.9.78.123",
]
# ── AWS Bedrock 支持 (可选, 需 boto3) ──
ai-hedge-bedrock = [
    "langchain-aws>=1.5.0",
]
# ── TimesFM 2.5 时序基础模型 (可选, 需 torch, ~800MB 模型权重) ──
# 安装: pip install -e .[timesfm]
# 用途: utils/timesfm_forecast.py 零样本时序预测 (价格/收益率)
timesfm = [
    "timesfm[torch]>=2.0.0",
]
# ── unsloth LLM 训练加速 (可选, 需 CUDA GPU, 2x-5x 加速 + 50% VRAM 节省) ──
# 安装: pip install -e .[llm-finetune]
# 用途: utils/llm_finetune.py GLM-5/Qwen 微调加速 (finetune_doubao 已 DEPRECATED)
# 支持: GLM4 MoE / Qwen2/Qwen3 / Llama / Mistral / Gemma
llm-finetune = [
    "unsloth>=2025.8.0",
]
# ── 云端额外依赖 (requirements-cloud.txt, 云 Linux 镜像在 core 之上安装) ──
cloud = [
    # 实盘桥接客户端 (调 Win 侧 qmt_rpc_server)
    "httpx>=0.27.0",
    # 监控指标
    "prometheus-client>=0.20.0",
    # 华为云 SDK (ModelArts 训练 + OBS)
    "huaweicloudsdkmodelarts>=3.1.0",
    "esdk-obs-python>=3.20.0",
    # 生产 ASGI 服务器 (Streamlit 多并发时可选; Win 侧 qmt_rpc_server 亦用, 与 win extras 重复声明)
    "uvicorn>=0.27.0",
    "fastapi>=0.110.0",
]
# ── Windows 实盘机专属 (requirements-win.txt, 在 core 之上安装) ──
# 注: pyautogui/pywinauto 已在主 dependencies (WIN_ONLY), 生成时自动并入 requirements-win.txt
win = [
    # FastAPI 网关 (Win 侧 qmt_rpc_server.py 用)
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
]
# ── 可选降级依赖 (requirements-optional.txt, 未安装时系统正常启动仅降级) ──
optional = [
    # FeatureStore 离线层 duckdb 后端 (utils/feature_store/offline_store.py,
    # offline_backend="duckdb" 时启用; 默认 parquet, ImportError 自动降级不抛异常)
    "duckdb>=1.0.0",
]

[tool.setuptools]
# 非包项目: 不安装任何包, 仅用于依赖管理
py-modules = []

[tool.ruff]
# ruff 配置指向 ruff.toml (保持单一事实源)
# 实际配置在 ruff.toml 中, 此处不重复

[tool.bandit]
exclude_dirs = ["tests", "cache", "_archive"]
skips = ["B101", "B110", "B112"]

# ============================================================
# 安装命令:
#   pip:  pip install -e .[dev]  (或 pip install -r requirements.txt)
#   uv:   uv sync --extra dev    (需先生成 uv.lock)
# ============================================================
