# config/settings.yaml —— v7.6 Institutional 全局配置
# 继承 v7.5 风控/回测/执行框架，更新为 300万股票ETF + 200万对冲 + 2030 清仓

system:
  version: "v7.6"
  base_capital: 5_000_000          # 500 万 RMB
  stock_etf_capital: 3_000_000     # 股票ETF账户 300 万
  hedge_capital: 2_000_000         # 对冲保护账户 200 万
  target_annual_return: 0.08       # 年化 8%
  max_drawdown: 0.15               # 最大回撤 15%
  clearance_date: "2030-12-31"     # 强制清仓
  timezone: "Asia/Shanghai"
  trading_hours_24x7: false        # A 股日内 + 夜盘期货对冲

# ============================================================
# v7.6 顶部对冲基金优化集成 — 6 个新增模块
# ============================================================
v76:
  enabled: true

  # 1. 波动率目标控制
  vol_targeting:
    target_ann_vol: 0.12           # 目标年化波动 12%
    max_leverage: 2.0              # 最大杠杆
    min_leverage: 0.25             # 最低持仓
    ewma_window: 20                # EWMA 窗口
    ewma_lambda: 0.94              # RiskMetrics
    smoothing_alpha: 0.30          # 缩放平滑
    dd_max_scale_reduction: 0.50   # 回撤>10%时额外减半

  # 2. 现金收益增强
  cash_yield:
    min_buffer: 50000              # 最低保留 5 万
    reverse_repo_ratio: 0.85       # 闲置 85% 做逆回购
    expected_yield_annual: 0.0155  # 年化 1.55%

  # 3. 对冲执行指挥官 (★期权优先模式)
  hedge_commander:
    hedge_mode: "options_primary"   # ★期权优先 (替代期货主导)
    target_beta: 0.10               # 目标净 Beta
    max_tolerance: 0.12             # 容忍偏差
    max_unhedged_days: 2            # 2 天未对齐→告警
    auto_close_gap: true            # 自动填补
    options_first: true             # ★优先使用期权对冲
    futures_only_fallback: true     # 期货仅作备用

  # 4. 信号拥挤度检测
  crowding:
    etf_flow_warning: 30e8         # ETF 单日>30亿警告
    etf_flow_extreme: 80e8         # ETF 单日>80亿极端
    decay_rate: 0.92               # 半衰期 ≈ 8 天

  # 5. Black-Litterman 预期收益
  black_litterman:
    risk_aversion: 2.50            # 风险厌恶系数
    tau: 0.05                      # 先验不确定度
    prior_confidence: 0.60         # 观点置信度

risk:
  # 风险预算核心参数（顶级对冲基金视角收紧）
  single_trade_risk: 0.012         # 单笔风险 1.2%（原1.5%）
  defense_dd_threshold: 0.08       # 防御模式触发回撤（原10%）
  circuit_break_dd: 0.10           # 熔断触发回撤（原14%）
  circuit_break_hours: 12          # 熔断冷却时间缩短（原24）
  hwm_window: 60                   # 滚动高水位窗口（交易日）
  # Kelly 收缩参数
  kelly_shrinkage_prior: "CAPM"    # James-Stein 收缩先验
  kelly_half: true                 # 使用半 Kelly
  kelly_tau2: 0.01                 # 先验方差
  # Risk Parity 参数
  risk_parity_erc: true            # 启用等风险贡献
  cov_estimator: "ledoit_wolf"     # 协方差收缩方法
  rp_max_iter: 100                 # Newton-Raphson 最大迭代
  rp_lr: 0.01                     # 学习率
  # 目标函数
  objective_sortino_weight: 1.0
  objective_calmar_weight: 0.5
  l2_regularization: 0.1
  # 行业集中度限制（新增）
  sector_concentration_limit: 0.25 # 单一行业 ≤ 25%
  single_name_limit: 0.08          # 单标的 ≤ 8%

hedging:
  # ★ 期权优先模式 — 期权为主导，期货为备用
  mode: "options_primary"
  # ---- Beta 对冲 ----
  beta_target: 0.1                 # 目标净Beta
  beta_trigger: 0.5                # 触发阈值
  beta_ewma_lambda: 0.94           # EWMA 衰减因子
  beta_window: 60                  # 滚动窗口
  hedge_cost_max: 0.005            # 最大对冲成本比例
  hedge_capital_ratio: 0.40        # 对冲资本占总资金比例
  total_hedge_capital: 2_000_000   # 对冲资本 200 万
  # 期权预算分配
  options_budget: 1_200_000        # ★期权预算 120 万 (60%)
  futures_budget: 300_000          # 期货预算 30 万 (15%)
  cash_buffer: 500_000             # 现金缓冲 50 万 (25%)
  # 期货备用 (仅作为期权未覆盖时的补充)
  futures_instruments:
    - {code: "IF", multiplier: 300, beta: 1.0, role: "backup"}
    - {code: "IM", multiplier: 200, beta: 1.1, role: "backup"}
  # ---- 期权对冲策略参数 ----
  options_strategies:
    # A. 领口策略 (Collar) — 高Beta科技股
    collar:
      enabled: true
      budget_pct: 0.35
      put_strike_offset: -0.05     # Put行权价 OTM 5%
      call_strike_offset: +0.15    # Call行权价 OTM 15%
      auto_roll_days: 7            # 到期前7天自动滚动
      max_age_days: 30             # 期权年龄上限
      target_beta_reduction: 0.40  # 目标Beta降低程度
    # B. 保护性看跌价差 (Put Spread) — 宽基ETF
    put_spread:
      enabled: true
      budget_pct: 0.20
      long_strike_offset: -0.03    # 买腿行权价 OTM 3%
      short_strike_offset: -0.12   # 卖腿行权价 OTM 12%
      max_spread_width: 0.10       # 最大价差宽度
      min_credit_ratio: 0.30       # 至少回收 30% 买腿成本
    # C. 看跌阶梯 (Put Ladder) — 尾部保护
    put_ladder:
      enabled: true
      budget_pct: 0.25
      strikes: [-0.03, -0.08, -0.15]
      weights: [0.50, 0.30, 0.20]  # 阶梯权重
      expire_monthly: true         # 月度滚动
    # D. 备兑看涨 (Covered Call) — Theta收入
    covered_call:
      enabled: true
      budget_pct: 0.10
      strike_offset: +0.08         # 卖Call OTM 8%
      max_assignment_risk: 0.30    # 最大被行权风险
      min_premium_yield: 0.015     # 最低年化权利金收益率
      monthly_roll: true           # 月频滚动
    # E. 风险逆转 (Risk Reversal)
    risk_reversal:
      enabled: true
      budget_pct: 0.05
      put_short_offset: -0.03
      call_long_offset: +0.05
      zero_cost_target: true       # 力求零成本
    # F. VIX尾部对冲
    tail_hedge:
      enabled: true
      trigger_vix: 25              # VIX > 25 触发
      put_strike_offset: -0.15     # 深虚Put OTM 15%
      budget_pct: 0.05
      status: "STANDING_ORDER"     # 条件触发待命
  # ---- 波动率对冲 (VIX尾部) ----
  vix_trigger: 25                  # VIX 触发阈值
  vix_emergency: 50                # VIX 紧急阈值
  # ---- 相关性对冲 ----
  corr_trigger: 0.85               # 相关性趋同触发
  corr_window: 30                  # 滚动窗口
  corr_jump_threshold: 0.15        # 较 60 日均值跳跃阈值
  gold_etf_code: "518880"
  gold_max_weight: 0.15            # 黄金上限
  repo_min_weight: 0.20            # 现金储备下限

execution:
  # Smart Order Routing（顶级对冲基金视角优化）
  iceberg_pct_depth: 0.05          # 盘口深度 5%（原10%，更保守）
  max_attempts: 3                  # 最大尝试 3 次（原5）
  throttle_seconds: 3              # 节流间隔 3 秒（原2）
  failover_ticks: 1                # 失败后对手价偏移
  # 滑点熔断（收紧）
  slippage:
    per_trade_break: 0.003         # 单笔 0.3%（原0.5%）
    daily_break: 0.005             # 当日累计 0.5%（原1.0%）
    global_slow_threshold: 0.002   # 全市场滑点中位数 0.2%（原0.3%）
    pause_minutes: 60              # 暂停时间 60 分钟（原30）
  # NTP 时间同步
  # 2026-07-09: 本地 CMOS 时钟漂移 ~1.2s, 无法通过 w32tm 软件同步修复
  # 阈值从 50ms → 2000ms (交易时间精度要求为秒级, 非毫秒级)
  # 服务器从 pool.ntp.org → ntp.tencent.com (国内延迟最低 60ms)
  ntp:
    server: "ntp.tencent.com"
    fallback_servers: ["ntp.aliyun.com", "cn.pool.ntp.org", "pool.ntp.org"]
    resync_interval_min: 30
    max_drift_ms: 2000
  # 交易时段与算法
  trading_windows:
    - {session: 'OPEN',  start: '09:30', end: '09:45', algo: 'TWAP'}
    - {session: 'MORN',  start: '09:45', end: '11:30', algo: 'VWAP'}
    - {session: 'NOON',  start: '13:00', end: '14:30', algo: 'VWAP'}
    - {session: 'CLOSE', start: '14:30', end: '15:00', algo: 'TWAP'}

backtest:
  frequency: "1min"
  commission:
    stock: 0.00025                # 万 2.5
    futures: 0.000023             # 万 0.23
    options: 5.0                  # 元/张
  slippage_model: "square_root"   # Almgren-Chriss
  slippage_coefficient: 0.142
  volatility_scaling: true
  financing:
    margin_long: 0.06             # 融资利率 6%
    margin_short: 0.06
    repo: 0.018                   # 国债逆回购 1.8%
  walk_forward:
    train_months: 24
    test_months: 3
    step_months: 3
    cv_folds: 5
    min_windows: 5
  stress_periods:
    - {name: 'COVID_CRASH', start: '2020-02-19', end: '2020-03-23'}
    - {name: 'LUNA_CRASH',  start: '2022-05-01', end: '2022-05-12'}
    - {name: 'YEN_CARRY',   start: '2024-08-01', end: '2024-08-05'}
  pass_criteria:
    max_dd_global: 0.15
    max_dd_stress: 0.15
    min_sortino: 1.0
    min_calmar: 0.5
    min_dsr: 0.95

data_sources:
  primary: "wind_terminal"        # P0
  secondary: "wind_mcp"           # P1
  tertiary: "ifind_mcp"           # P2
  fallback: "akshare"             # P3

api_keys:
  wind_api_key: "${WIND_API_KEY}"
  ifind_token: "${IFIND_TOKEN}"

# ============================================================
# 信号融合配置 (Qlib + iFinD 新闻 + 外部报告 + 宏观因子)
# ============================================================
signal_fusion:
  # 动态权重（基于市场 regime，顶级对冲基金视角）
  regime_adaptive: true
  bull_weights: {qlib: 0.50, ifind: 0.30, external: 0.20}      # 牛市：外部报告更重要
  bear_weights: {qlib: 0.40, ifind: 0.40, external: 0.20}      # 熊市：iFinD 负面新闻权重提升
  crisis_weights: {qlib: 0.30, ifind: 0.30, external: 0.40}    # 危机：外部报告主导
  # 默认权重（当 regime 未知时）
  qlib_weight: 0.50
  ifind_weight: 0.30
  external_weight: 0.20
  # 融合因子 clamp 范围
  fused_factor_min: 0.5
  fused_factor_max: 1.3
  # iFinD 重大负面新闻熔断
  ifind_circuit_breaker:
    enabled: true
    direction: "negative"
    min_confidence: 0.85             # 0.9 → 0.85，降低误触发
  # iFinD 研判 → 因子映射
  ifind_factor_map:
    positive_high: 1.2
    positive_mid: 1.0
    neutral: 1.0
    negative_high: 0.0
    negative_mid: 0.5
    default: 1.0
  # Qlib 信号 → 因子映射
  qlib_factor_map:
    strong_long: 1.3
    long: 1.0
    neutral: 0.8
    short: 0.5
    strong_short: 0.0
  # 宏观因子（新增）
  macro_factors:
    vix_regime: true                 # VIX 市场状态
    rate_surprise: true              # 利率意外
    fx_stress: true                  # 汇率压力
    credit_spread: true              # 信用利差
  # 模型缓存
  model_cache:
    enabled: true
    retrain_days: 30

# ============================================================
# 尾部风险保护（期权优先视角）
# ============================================================
tail_risk_protection:
  stress_test_frequency: "weekly"
  tail_hedge:
    enabled: true
    trigger: -0.05                   # 组合回撤 -5% 触发
    instruments:
      - type: "index_put_ladder"     # ★期权Put阶梯替代期货空头
        allocation: 0.05             # 5% 资金买三阶Put
        strikes: [0.97, 0.92, 0.85]  # OTM 3%/8%/15%
        weights: [0.50, 0.30, 0.20]
      - type: "vix_call"
        allocation: 0.02             # 2% 资金买 VIX 看涨
        trigger: 35
      - type: "collar_protection"    # ★新增：领口保护
        allocation: 0.03             # 3% 资金建领口
        put_strike: 0.95
        call_strike: 1.15
  liquidity_reserve: 0.10           # 10% 现金/货币基金储备

# ============================================================
# 同花顺期货通交易配置（模拟交易 / 真实交易）
# ============================================================
ths_futures:
  mode: "sim"                        # sim=模拟盘, real=真实盘
  sim_capital: 2_000_000             # 模拟盘初始资金
  data_source_priority:
    - "ifind_mcp"
    - "akshare"
    - "fallback"
  # 模拟交易配置
  simulation:
    enabled: true
    slippage_bps: 5                  # 模拟滑点 bps
    commission_rate: 0.000023        # 模拟手续费
    log_enabled: true
    log_path: "logs/ths_sim_trades.jsonl"
  # 真实交易配置（预留）
  real_trading:
    enabled: false                   # 是否启用真实交易
    client_path: ""                  # 同花顺期货通客户端路径
    use_pywinauto: true              # 是否使用 pywinauto 自动化
    screenshot_enabled: true         # 下单前截图记录
    confirm_before_trade: true       # 下单前确认
  # 夜盘配置
  night_session:
    enabled: true
    start_time: "21:00"
    end_time: "23:00"
