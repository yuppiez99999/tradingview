# config/execution.yaml —— v7.5 执行算法参数

sor:
  iceberg_pct_of_depth: 0.10     # 冰山订单占盘口深度比例
  max_attempts: 5                # 最大重试次数
  throttle_seconds: 2            # 请求节流
  failover_tick_offset: 1        # 失败后对手价偏移(tick)

slippage:
  per_trade_break: 0.005         # 单笔滑点熔断 0.5%
  daily_cumulative_break: 0.010  # 当日累计熔断 1.0%
  global_slow_threshold: 0.003   # 全市场中位数滑点
  pause_duration_minutes: 30     # 暂停时长
  max_consecutive_pauses: 3      # 最多连续暂停次数

ntp:
  server: "pool.ntp.org"
  resync_interval_min: 60
  max_drift_ms: 50
  retry_servers:
    - "time.windows.com"
    - "cn.pool.ntp.org"

trading_windows:
  - {session: 'OPEN',  start: '09:30', end: '09:45', algo: 'TWAP', interval_sec: 30}
  - {session: 'MORN',  start: '09:45', end: '11:30', algo: 'VWAP', interval_sec: 120}
  - {session: 'NOON',  start: '13:00', end: '14:30', algo: 'VWAP', interval_sec: 120}
  - {session: 'CLOSE', start: '14:30', end: '15:00', algo: 'TWAP', interval_sec: 30}

algo_params:
  twap:
    default_slices: 10
    min_slice_pct: 0.05
  vwap:
    volume_profile_lookback: 20  # 历史成交量参考天数
    participation_rate: 0.10     # 参与率 10%
  pov:
    target_participation: 0.05   # 目标参与率 5%
    max_duration_min: 120        # 最大执行时长

broker:
  type: "mock"                   # mock / ctp / qmt / wind
  connect_timeout_sec: 30
  heart_beat_interval_sec: 10
  max_reconnect_attempts: 3
