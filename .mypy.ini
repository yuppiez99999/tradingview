# mypy 配置文件 — 量化交易系统 v8.6
# 创建: 2026-08-02 | 工程化达标 T01 Phase A

[mypy]

# === Python 版本 ===
# P2-6 修复 (2026-08-07): 从 3.8 对齐到 3.14 (实际运行版本)
python_version = 3.14

# === 模块检查策略 ===
# P0/P1 模块: 严格检查 (must follow_hard_imports)
# P2 模块: 允许 type: ignore 压制
# _archive 模块: 完全排除

# 排除 _archive (214个已归档文件, 不修) + research quarantine (P0-1 隔离的破损文件)
exclude = _archive/|_archive/research_references_quarantine/

# 允许隐式 Optional (Dict = None → 语义等价于 Optional[Dict] = None)
# 关闭此规则消除 ~40 条误报
implicit_optional = True

# === 错误规则配置 ===
# 关闭选定的严格规则以减少噪声
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = False

# 允许 type: ignore 注释
warn_unused_ignores = False

# === 第三方库忽略 (无 stubs) ===
[[tool:mypy]]
ignore_missing_imports = True

# === 模块级 Override ===
# P0 核心风控: 严格检查
[mypy-utils.wt_risk_control]
disallow_untyped_defs = False
check_untyped_defs = True

# 因子库: 允许宽松
[mypy-utils.alpha.*]
disallow_untyped_defs = False

# === P2 模块: 宽松检查 (第三方SDK/遗留代码/ML实验) ===
# ifind-client: 第三方SDK, 无类型stub
[mypy-utils.ifind.*]
ignore_errors = True

# data_provider: 多数据源适配层, 大量动态类型
[mypy-utils.data_provider]
disallow_untyped_defs = False
warn_return_any = False

# wt_spread_strategy: 遗留WildTiger集成, P2
[mypy-utils.wt_spread_strategy]
ignore_errors = True

# tf_price_predictor: ML实验模块, 底层库无类型注解
[mypy-utils.tf_price_predictor]
disallow_untyped_defs = False
warn_return_any = False

# vibe_trading 研究模块: 探索性代码, P2
[mypy-research.vibe_trading_factor_analysis.*]
ignore_errors = True

# vol_target_controller: 量化金融公式, 大量float/int数学
[mypy-utils.vol_target_controller]
disallow_untyped_defs = False
