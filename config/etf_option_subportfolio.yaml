  s8_trend_vol:
    status: "candidate"
    params:
      trend_layer: "510300 vs MA200 + MA200斜率 → bull 1.0 / choppy 0.7 / bear 0.4"
      vol_target: "组合滚动60日年化波动率 → min(1.0, max(0.3, 12%/σ))"
      drawdown_breaker: "回撤12%/18% → 敞口50%/25%, 修复8%且趋势转多才恢复"
      cost_model: "权益敞口换手 × (0.03%+0.10%) 从净值扣除"
    metrics_2021_2026: {annual_return_pct: 5.61, max_drawdown_pct: 17.87, sharpe: 0.301}
    metrics_2015_2026: {annual_return_pct: 6.9, max_drawdown_pct: 18.8, sharpe: 0.44}
    honest_validation: {dsr: 0.0, cpcv_cv: 1.479, noise_stable: true, verdict: "NOT HONEST"}
  s9_defensive_dumbbell:
    status: "candidate"
    params:
      defensive_weights: {518880: 0.28, 511260: 0.12}
      defensive_rule: "黄金/国债恒满仓, 只砍权益敞口 (哑铃)"
      equity_rule: "权益60%按 positions 原权重等比缩放"
      signal_layer: "同 S8: 趋势过滤×波动率目标×分级熔断"
      cost_model: "权益敞口换手 × (0.03%+0.10%) 从净值扣除"
    metrics_2021_2026: {annual_return_pct: 7.38, max_drawdown_pct: 12.64, sharpe: 0.492}
    metrics_2015_2026: {annual_return_pct: 7.7, max_drawdown_pct: 16.1, sharpe: 0.57}
    honest_validation: {dsr: 0.0002, cpcv_cv: 0.715, noise_stable: true, verdict: "NOT HONEST (样本翻倍仍不足, 资产池Sharpe上限≈0.6)"}
    lookahead_note: "防御40%取扫描中间档(非最优45%), 权重基于2021-2026历史选择存在后视成分, 已用2015-2020样本外段验证稳健"
  s10_p2_pool_upgrade:
    status: "candidate"
    params:
      universe: "17标的 = 原14 + 纳指100(513100) + 标普500(513500) + 红利低波(512890), 数据源 Wind MCP qfq"
      defensive_weights: {518880: 0.25, 511260: 0.10, 512890: 0.10}
      offensive: "纳指10% + 标普10% + 原11权益等比缩至35%"
      signal_layer: "同S8/S9: 趋势过滤×波动率目标×分级熔断 (对海外资产存在信号错配但结果稳健)"
    metrics_2021_2026: {annual_return_pct: 9.46, max_drawdown_pct: 11.41, sharpe: 0.793}
    honest_validation: {dsr: 0.0, cpcv_cv: 0.567, noise_stable: true, verdict: "NOT HONEST (Sharpe0.79仍需≈24年样本过DSR, 统计门槛而非策略失败)"}
    note: "P2实证: 高Sharpe资产池(单资产标普0.82/纳指0.78/红利低波0.66)实打实提升组合上限, 但不足以过n_trials=14多重检验门槛; 分段2021-2023 +0.24/2024-2026 +1.39 双段优于S9"