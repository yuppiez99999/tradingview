# ============================================================
# 期权对冲配置 (纯ETF期权, 无股指期货)
# ============================================================
# 复用 utils/protective_put_engine.py
# 策略: Protective Put (主) + Collar (横盘) + Put Spread (降本)
options_hedge:
  enabled: true
  total_capital: 2_000_000
  max_annual_cost_pct: 0.035

  # 认沽保护目标 (复用 protective_put_engine.PROTECTION_TARGETS 结构)
  protection_targets:
    - code: "510050"
      name: "上证50ETF"
      exchange: "SSE"
      contracts: 30
      priority: 1
      reason: "核心蓝筹保护+主力Beta对冲, 30张覆盖约50%组合Beta暴露"
      budget_pct: 0.35
    - code: "510300"
      name: "沪深300ETF"
      exchange: "SSE"
      contracts: 15
      priority: 2
      reason: "系统性保护, 替代IF期货空头"
      budget_pct: 0.20
    - code: "588080"
      name: "科创50ETF"
      exchange: "SSE"
      contracts: 12
      priority: 3
      reason: "科技成长保护, 高Beta高波动"
      budget_pct: 0.18
    - code: "159915"
      name: "创业板ETF"
      exchange: "SZSE"
      contracts: 12
      priority: 4
      reason: "成长保护, 创业板波动大"
      budget_pct: 0.17

  # 期权参数
  otm_pct: 0.05
  target_dte_min: 25
  target_dte_max: 60
  preferred_dte: 45
  roll_dte_threshold: 5
  etf_option_multiplier: 10000

  # 策略选择 (基于市场状态)
  strategies:
    calm:
      primary: "protective_put"
      description: "正常市场: 仅维持基础认沽保护"
    mild_volatile:
      primary: "protective_put"
      secondary: "collar"
      description: "温和波动: 认沽保护+领口策略限上行降成本"
    high_volatile:
      primary: "protective_put"
      secondary: "put_spread"
      description: "高波动: 加码认沽+看跌价差降本"
    tail_event:
      primary: "protective_put"
      secondary: "put_spread"
      description: "尾部事件: 认沽加码1.5-2.0倍+看跌价差"

# ============================================================
# 自我再平衡配置
# ============================================================
# 复用 config/rebalance.yaml + utils/hedge_rebalance_integrator.py
rebalance:
  strategy: "threshold_rebalance"
  threshold: 0.04
  min_interval_days: 5
  schedule: "monthly"
  trade_day_of_month: 1

  trading:
    min_trade_amount: 1000
    max_trade_pct: 0.10
    slippage: 0.001
    commission_rate: 0.0003
    stamp_duty: 0.0

  batch_execution:
    enabled: true
    max_batches_per_day: 3
    batch_interval_minutes: 60

  risk_control:
    max_single_weight: 0.20
    max_sector_weight: 0.60
    max_category_weight: 0.65
    stop_loss_pct: -0.08
    take_profit_pct: 0.20
    max_drawdown_alert: 0.10

# ============================================================
# 风控硬约束 (回撤<15%是硬控制)
# ============================================================
# 复用 utils/drawdown_breaker.py + utils/kill_switch.py
risk_control:
  max_drawdown_limit: 0.20
  margin_limit: 0.20
  fat_finger_limit: 500000
  drawdown_recovery_threshold: 0.08

  drawdown_breaker:
    level_0_normal:
      threshold: 0.12
      action: "无限制, 100%敞口"
    level_1_warn:
      threshold: 0.15
      action: "净敞口降至70%, 暂停新开多头"
    level_2_force_reduce:
      threshold: 0.18
      action: "净敞口降至50%, 暂停新仓"
    level_3_halt:
      threshold: 1.0
      action: "净敞口降至30%, 仅留核心ETF底仓+对冲"

  kill_switch:
    daily_loss_limit: -0.03
    consecutive_loss_limit: 5
    pause_minutes: 10
    margin_l1: 0.50
    margin_l2: 0.65
    margin_l3: 0.75

  # 6个历史压力测试场景 (复用 config/risk.yaml)
  stress_test_scenarios:
    - "2015股灾"
    - "2016熔断"
    - "2018贸易战"
    - "2020疫情闪崩"
    - "2022俄乌冲突"
    - "2024地产危机"

# ============================================================
# Alpha增强配置
# ============================================================
# 复用 utils/portfolio_optimizer.py + V9/MVSK信号
alpha_enhancement:
  enabled: true
  method: "BL_MVSK_378"
  train_window_days: 378
  gamma_s: 0.1
  gamma_k: 0.1
  conservative_alpha: 0.05
  signal_source: "models/pipeline_factor_signals"

# ============================================================
# ETF资金流加减仓配置
# ============================================================
# 复用 utils/broad_based_etf_policy.py
etf_flow_adjustment:
  enabled: true
  min_scale: 0.5
  max_scale: 1.5
  adjust_bands:
    strong_inflow: { threshold_yi: 50, coefficient: 0.30 }
    inflow: { threshold_yi: 10, coefficient: 0.15 }
    mild_inflow: { threshold_yi: 2, coefficient: 0.05 }
    neutral: { threshold_yi: -2, coefficient: 0.0 }
    mild_outflow: { threshold_yi: -10, coefficient: -0.05 }
    outflow: { threshold_yi: -50, coefficient: -0.15 }
    strong_outflow: { threshold_yi: -999, coefficient: -0.30 }

# ============================================================
# 回测验证配置
# ============================================================
