# ============================================================
# 候选策略登记 (2026-08-31 研发落地, 状态=candidate 待纸面跟踪)
# ============================================================
# S8/S9 在 run_etf_option_backtest.py 实现 (all_strategies), 均优于 S1-S7。
# 诚实三件套 (DSR+CPCV+Noise, n_trials=14) 未达 HONEST → 按 Alpha 生命周期
# Stage 6-7 走影子账户纸面跟踪, 满足 admission_criteria 前不进入生产主策略。
# 长样本 (2015-2026, n=2830) 分段验证: S9 在 2015-2020 与 2021-2026
# 两段 Sharpe 0.57/0.54 一致 → 防御倾斜非过拟合 (黄金/国债是池内唯一正 alpha 源)。
