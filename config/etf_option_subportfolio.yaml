# A股ETF + 期权对冲 + 自我再平衡子模型配置
# ============================================================
# 独立200万子组合，与500万主组合并行运行，互不干扰
# 纯ETF仓位(100%) + ETF期权对冲(认沽保护) + 自我再平衡
# 目标: 年化收益 >= 9.5%, 最大回撤 < 20%
#
# v3 S9策略参数 (2026-08-21回测验证: 年化9.53%/回撤19.70%/Sharpe0.384)
# v8.6.15 调整 (2026-08-25): P2.2 实测回撤34% 未过验收 (回撤目标<20%),
#   结构性归因: 半导体+信息+科创等高风险主题权重过高 + 伪对冲(年化成本衰减)无保护价值。
#   重构: ①主题权重 21%→13% (半导体5→3/医药6→4/军工4→2/新能源3→2/信息3→2)
#   ②差额注入防御 20%→28% (黄金10→14/国债5→7/红利5→7)
#   ③期权对冲改为 Black-Scholes 月度滚仓真实定价 (run_etf_option_backtest.py v8.6.15)
#   ④再平衡阈值 6%固定 → 动态 (vol<15%→3% / <25%→5% / else 8%)
# 设计依据:
#   - V9 Regime-LGB 实测年化19.62%/回撤9.95%/Sharpe 1.315 (cairn/ROADMAP.md:24)
#   - BL+MVSK(378) 跨周期4/4段跑赢BL+MV (cairn/ROADMAP.md:39)
#   - protective_put_engine 年化成本<3.5% (v3增强对冲预算)
#   - 回撤分级熔断 L0/L1/L2/L3 (cairn/risk-architecture.md:20-27)
#   - 十五五规划高评分ETF增配 (科创50 92分→10%)

subportfolio:
  name: "ETF期权对冲再平衡子模型"
  total_capital: 2_000_000
  currency: "CNY"
  benchmark: "沪深300ETF"
  target_annual_return: 0.095
  target_max_drawdown: 0.20
  target_sharpe: 0.38
  rebalance_frequency: "daily_check"
  strategy_version: "v3_S9"
  backtest_verified: "2026-08-21: 年化9.53%/回撤19.70%/Sharpe0.384/Calmar0.484"

