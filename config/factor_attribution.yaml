# Factor 归因配置 — 基准因子暴露
# 默认值对标沪深300(市场基准), 待产品/量化侧确认精确数值
# Beta=1.0 表示基准组合满仓市场, 风格因子暴露为 0

benchmark_factor_exposures:
  Beta: 1.0
  Size: 0.0
  Momentum: 0.0
  ResidualVolatility: 0.0
  NonLinearSize: 0.0
  BookToPrice: 0.0
  Liquidity: 0.0
  EarningsYield: 0.0
  Growth: 0.0
  Leverage: 0.0

factors:
  - code: Size
    name: 市值
  - code: Beta
    name: 市场敏感度
  - code: Momentum
    name: 动量
  - code: ResidualVolatility
    name: 拮差波动率
  - code: NonLinearSize
    name: 非性市值
  - code: BookToPrice
    name: 账面市值比
  - code: Liquidity
    name: 流动性
  - code: EarningsYield
    name: 盈利收益率
  - code: Growth
    name: 增长
  - code: Leverage
    name: 杠杆
