# ============================================================
# risk_thresholds.yaml — 风控阈值单一事实源 (S-1/S-2 修复, Issue #13)
# ============================================================
#
# 背景: Issue #13 巡检发现"同一风控语义存在多套互不相干的口径":
#   - config/trade_execution.yaml: daily_loss_stop_pct 3% / portfolio_drawdown_stop_pct 5%
#   - daily_trade_executor.py:      StopLossManager(stop_loss_pct=0.08, take_profit_pct=0.15) 硬编码
#   - ai_decision.MIN_SAMPLES/阈值: 因子有效性判定口径无显式来源
#   - ai_decision L2:               gate.max_single_pct 2% 与真实 200 万组合不匹配
# 本文件把上述口径收敛为唯一可审计来源; 代码侧一律经
#   utils/risk_thresholds.py 读取 (缺失 → 模块内安全默认 + WARNING, fail-open 不阻断)。
#
# 修改任何数值都属风控口径变更, 需人工审阅 (勿由自动化顺手改)。
# ============================================================

# --- 止损 / 止盈 (S-1) ---
# 消费: utils/wt_risk_control.StopLossManager (daily_trade_executor 经 risk_thresholds 注入)
# 口径对齐说明: 原硬编码 8%/15% 与 trade_execution.yaml 的熔断线 (3%/5%) 互不相干,
#   现统一为同源配置, 便于"止损先于熔断触发"的一致性审计。
stop_loss:
  stop_loss_pct: 0.08          # 单标的止损线 -8%
  take_profit_pct: 0.15        # 单标的止盈线 +15%
  # S-1: 触发后需人工确认, 未确认时每日重复告警 (可重试), 不再一次性静默失效
  require_manual_confirm: true
  # S-1: 触发告警升级为阻断性告警 —— 计入 escalation 计数, 影响灰度推进条件
  block_on_trigger: true

  # ================= S-1 止损自动平仓授权 (Issue #13, 2026-09-12) =================
  # 背景: S-1 先前只到"阻断性告警 + 每日重复告警 + 待人工确认", 因为自动平仓涉及
  #   自动下单权限, 需与灰度阶段 (auto_10) 的风险预算一起定。本节把**三个授权口径**
  #   全部落成唯一事实源, 使"授权即可启用"变成翻一个开关, 而不是再写一轮代码。
  #
  # 三个授权口径 (code: executor/stop_loss_liquidation.py)
  #   口径 1 · 授权范围 (scope)
  #     - 仅 stop_loss (止盈不自动平仓; 止盈属收益实现, 不是风险处置)
  #     - 仅已持仓标的 (positions 中真实存在且数量 > 0)
  #     - 仅减仓不反手 (reduce_only: 只允许 SELL, 且数量 <= 持仓数量)
  #     - 单标的单日最多 max_liquidations_per_symbol_per_day 次
  #   口径 2 · 与 auto_10 风险预算的关系 (budget)
  #     - 自动平仓属**降风险**动作, 默认豁免日度下单额度与单笔上限。
  #       ⚠ 若不豁免: 极端行情下可能因额度耗尽而平不掉仓 —— 这正是最易踩的坑。
  #     - 豁免必须可审计: 每次豁免在平仓记录里写 exempted_from 字段, 不静默豁免。
  #   口径 3 · 失败处置 (failure)
  #     - 平仓单被拒/部分成交: 重试上限 max_exec_retries, 累计到上限后
  #       escalate_on_failure=true → 升级人工介入并保持阻断 (绝不静默放弃)。
  #
  # 默认 enabled: false —— 与启用前行为**逐字节一致** (仅走阻断性告警)。
  # 修改任何数值都属风控口径变更, 需人工审阅 (勿由自动化顺手改)。
  auto_liquidate:
    enabled: false                       # 总开关 (false = 维持阻断性告警, 零行为变化)
    # --- 口径 1: 授权范围 ---
    scope: stop_loss_only                # 仅 stop_loss (唯一合法值, 防止配置漂移)
    allow_take_profit: false             # 止盈不自动平仓
    held_positions_only: true            # 仅已持仓标的
    reduce_only: true                    # 仅减仓不反手 (禁止 SELL 数量 > 持仓)
    max_liquidations_per_symbol_per_day: 1
    # --- 口径 2: 与 auto_10 风险预算的关系 ---
    exempt_from_daily_quota: true        # 豁免日度下单额度 (降风险动作)
    exempt_from_single_trade_limit: true # 豁免单笔名义上限
    # --- 口径 3: 失败处置 ---
    max_exec_retries: 2                  # 总尝试次数上限 (含首次); 达上限 → 升级人工
    escalate_on_failure: true            # 达上限后升级人工 + 保持阻断
    # 平仓单滑点处理: 沿用 daily_trade_executor 的 SELL 滑点 (向下), 不另设

# --- 组合级保护事件 (S-2 前置, 防 auto_10 阶段初期无自动回滚保护) ---
# 消费: ai_decision.grayscale_state.GrayscaleState.should_rollback()
portfolio_protection:
  # 阶段初期 (daily_pnl_series 样本不足) 的绝对回撤阈值, 补 2σ 分支的盲区
  initial_drawdown_stop_pct: 0.05   # 累计 PnL <= -5% → 回滚一档
  initial_min_samples: 5            # 少于该样本数时走绝对阈值分支 (不启用 2σ)

# --- AI 决策执行层 L2 (S-2) ---
# 消费: ai_decision.execution_risk._execution_risk_check / decision_gate / execution_bridge
# 口径: 单笔名义金额 <= portfolio_value * max_single_pct
#   真实组合 (system_config.json stock_etf_capital=2000000) 下的单笔上限。
#   5% = 10 万元/笔, 与 trade_execution.yaml daily_fixed_budget 20 万/日 同量级。
l2_execution:
  max_single_pct: 0.05              # 单笔 <= 净值 5%
  max_daily_pct: 0.20               # 日内累计 <= 净值 20%
  default_portfolio_value: 2000000  # 组合净值默认值 (原 100 万, 与真实 200 万不符)
  # S-2: 队列消费时用执行计划的真实限价填充切片价, 不用持仓参考价/市价兜底
  fill_queue_price_from_plan: true

# --- 因子有效性判定 (P1-3) ---
# 消费: utils.factor_research.factor_discovery.FactorValidator
# 说明: 旧口径 (MIN_SAMPLES=5 / |IC|>=0.02 / |IR|>=0.2 / 评分三项 abs)
#   已导致"单日 IC 即可判有效"与"稳定反向因子得分 = 稳定正向"。
#   新口径为 research 基线重置, 采用"新口径 primary + 旧口径影子对照"双跑输出,
#   历史因子库不静默重判 (见 factor_discovery.FactorValidator.SHADOW_LEGACY)。
factor_validation:
  min_samples: 60               # 原 5: 需 >=60 个日度 IC 样本才评估
  ic_effective_threshold: 0.03  # 原 0.02: |IC| 有效门槛
  ir_effective_threshold: 0.5   # 原 0.2: |IR| 有效门槛
  ic_strong_threshold: 0.05
  ir_strong_threshold: 0.5
  # 评分口径: signed = 带符号 IC (惩罚反向因子) / abs = 旧行为
  score_mode: signed
  # 影子对照: true 时同时计算旧口径结果 (legacy_effective / legacy_score), 仅报告不改判定
  shadow_legacy: true

# --- 资金口径 (P1-2 / SC-2 工程半边, 2026-09-11; 口径拍板 2026-09-11) ---
# 消费: utils.risk_thresholds.get_capital_base_config() —
#   rebalance_execution_orders.TARGET_TOTAL / rebalance_order_executor /
#   protective_put_engine.TOTAL_CAPITAL 默认 / hedge_execution_engine 兜底 /
#   automated_execution_system / v8.3_institutional WorkflowConfig /
#   institutional_pipeline_runner 默认值。
#
# ============================ 口径拍板 (2026-09-11, Issue #13) ============================
# 结论: 权威总口径 = 3,000,000 (证券/ETF 腿 2,000,000 + 对冲腿 1,000,000)。
#
# 依据 (均为仓库内既有已拍板事实, 非本次新造):
#   1. 命名路线 = p9_200w_preset (证券 200 万实盘灰度) + 期货 100 万 (ROADMAP
#      performance_targets.accounts; 目标结构 300 万 = 200 + 100)
#   2. config/kill_switch.yaml total_margin = 3,000,000 —— 2026-09-11 item 12
#      已按此拍板, 并显式把 positions.json meta 的 5M 定性为"旧链历史头 (v8.0)"
#   3. system_config.json total_capital = 3,000,000 (2M + 1M) 声明权威
#   4. 8%~18% 绩效口径分母 = 期初实际到位总权益 (证券 200 + 期货 100 合计)
#   5. Sprint3 资本升级门终点 = 200 万正式 (docs/sprint3_capital_upgrade_gate_20260905.md)
#
# 5,000,000 的处置: 系 2026-07 建仓计划 (证券 300w + 期货 200w) 的**计划口径**,
#   已被上述 4 项后续决策取代。审查报告 (docs/代码质量与系统Bug审查_20260911.md
#   §P1-2) 量化: 再平衡目标按 5M 生成 vs 实际账本 ≈274 万 → 高估 ~82%; 同链
#   对冲手数 ~1.82× 过度对冲。故本次**不再作为权威口径**。
#
# 腿语义 (禁止混淆, 三项各有唯一消费面):
#   - total_capital    : 总口径 → 风控预算 / kill_switch / institutional pipeline
#                        / 组合级绩效分母。**不得**作为再平衡单腿目标基数。
#   - stock_etf_capital: 证券/ETF 腿 → **再平衡链基数** (此前误用 5M 的正是此处)。
#   - hedge_capital    : 对冲腿 → 对冲链成本预算 / 期权预算基数。
#
# 运行时优先序 (utils.risk_thresholds.resolve_effective_capital):
#   positions.json meta 显式值 > 本段静态口径 > 模块内默认。
#   注: 实际证券账本 ≈2,741,928 属**运行时真实值**, 会随建仓/行情漂移,
#   由 positions meta / 权益派生优先取用; 本段仅作静态基准与兜底, 不硬编码
#   会过期的余额。缺运行时值时应显式告警, 不得静默把静态基准当真实权益。
#
# 修改任何数值都属资金口径变更, 需人工审阅 (勿由自动化顺手改)。
# =======================================================================================
capital_base:
  total_capital: 3000000        # 总口径 (证券 200w + 对冲 100w)
  stock_etf_capital: 2000000    # 证券/ETF 腿 (再平衡链基数)
  hedge_capital: 1000000        # 对冲腿 (对冲链预算基数)
