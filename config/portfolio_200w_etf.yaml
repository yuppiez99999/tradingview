    name: "沪深300ETF"
    type: etf
    market: "SH"
    capital: 300000                    # 30万
    weight: 0.15
    option_available: true
    hedge_strategy: "protective_put"   # 保护性看跌
    description: "大盘基石"

  - code: "510500"
    name: "中证500ETF"
    type: etf
    market: "SH"
    capital: 300000                    # 30万
    weight: 0.15
    option_available: true
    hedge_strategy: "protective_put"   # 保护性看跌
    description: "中盘成长"

  - code: "513100"
    name: "纳斯达克100ETF(QDII)"
    type: etf
    market: "SH"
    capital: 300000                    # 30万
    weight: 0.15
    option_available: false            # QDII期权不可用
    hedge_strategy: "reverse_etf_or_futures"  # 用境内反向ETF/期货替代
    fx_risk_budget_pct: 0.01           # 汇率风险预算 1%/年
    description: "全球科技增长引擎"

  - code: "512890"
