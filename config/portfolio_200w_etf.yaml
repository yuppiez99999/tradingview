# ============================================================================
# 200万ETF+期权投资组合配置 v1.0
# ============================================================================
# 计划期限: 2026.08 - 2030.08 (4年, 可弹性延至2031)
# 驱动逻辑: 康波第六轮复苏期 + 十五五规划 + AI/科技主线
# 对应文档: 每日报告归档/2026-08-23/200万ETF期权投资计划_系统完善报告_20260823.md
# 引擎入口: AutoHedgeRebalanceEngine(config_path="config/portfolio_200w_etf.yaml")
# ============================================================================

# ---------------------------------------------------------------------------
# 组合概览
# ---------------------------------------------------------------------------
portfolio:
  name: "200万ETF+期权投资组合"
  total_capital: 2000000               # 200万元
  currency: CNY
  inception: "2026-08-23"
  horizon: "2030-08-31"               # 计划到期 (弹性延至2031)
  strategy: "core_satellite_with_options"
  description: |
    核心-卫星架构 (60%核心 + 25%卫星 + 15%现金/对冲),
    期权用于保护与增强 (Protective Put / Covered Call / Deep OTM Put),
    禁止组合 Delta 为负 (不主动做空),
    2030年6月前全部清仓退出 (弹性退出条件: 康波繁荣期强势)。

# ---------------------------------------------------------------------------
# 目标约束
# ---------------------------------------------------------------------------
target:
  annual_return: 0.08                  # 年化收益目标 8%
  max_drawdown: 0.15                   # 最大回撤约束 15% (ETF组合更保守)
  min_sharpe: 0.5                      # 最低夏普比率

# ---------------------------------------------------------------------------
# 资产配置: 核心仓位 (60% / 120万)
# ---------------------------------------------------------------------------
core_holdings:
