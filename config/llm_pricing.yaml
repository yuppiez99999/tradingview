# LLM 价格表 (外置配置, P2 重构)
# 单位: 元 / 1K tokens
# 来源: 各厂商官方定价 (2024-2025 行情估算), 定期更新此文件即可调整成本口径
# AICoordinator 启动时加载; 缺失字段回退到代码内置默认值
# 2026-09-07: 剔除 doubao/doubao_speed, 新增 MLX 本地模型 (零 API 成本)

models:
  # === MLX 本地模型 (Apple Silicon, 零 API 成本, 仅电费) ===
  mlx_qwen3_4b:
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_tokens: 32000
  mlx_qwen3_8b:
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_tokens: 32000
  mlx_qwen3_14b:
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_tokens: 32000
  mlx_qwen3_32b:
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_tokens: 32000
  mlx_deepseek_r1_32b:
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_tokens: 32000
  # === 云端 API (交叉验证 / fallback) ===
  glm5:
    cost_per_1k_input: 0.015
    cost_per_1k_output: 0.015
    max_tokens: 128000
  glm5_air:
    cost_per_1k_input: 0.005
    cost_per_1k_output: 0.015
    max_tokens: 128000
  deepseek:
    cost_per_1k_input: 0.002
    cost_per_1k_output: 0.008
    max_tokens: 64000
  deepseek_reasoner:
    cost_per_1k_input: 0.004
    cost_per_1k_output: 0.016
    max_tokens: 64000
  default:
    cost_per_1k_input: 0.01
    cost_per_1k_output: 0.03
    max_tokens: 8000

daily_token_budget: 500000
